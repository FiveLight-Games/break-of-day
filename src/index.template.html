<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#120d08">
<title>Break of Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--stone:#1c1712;--stone2:#2a2219;--gold:#d9b25f;--gold2:#f0d68a;--ink:#efe6d2;--muted:#a59a83;--red:#e0483e;--blue:#4a9aff;--green:#5ad06a;--line:#5a4a30}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0907;color:var(--ink);font:14px/1.35 Inter,system-ui,sans-serif;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit}
.hidden{display:none!important}
h1,h2,h3{font-family:Cinzel,serif;margin:0 0 8px}
small{display:block;color:var(--muted);font-size:11px}
.muted{color:var(--muted)} .gold{color:var(--gold2)} .ok{color:var(--green)} .warnTxt{color:#ff9a5a}
.btn{background:linear-gradient(#5a4220,#3a2a14);border:1px solid var(--gold);border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer;box-shadow:inset 0 1px 0 #ffffff22,0 2px 6px #0008;color:var(--gold2)}
.btn:hover:not(:disabled){filter:brightness(1.2)} .btn:disabled{opacity:.4;cursor:default}
.btn.sm{padding:6px 10px;font-size:12px} .btn.wide{width:100%;margin:4px 0} .btn.ghost{background:transparent} .btn.danger{border-color:var(--red);color:#ffb0a0}
.panel{background:linear-gradient(var(--stone2),var(--stone));border:1px solid var(--line);border-radius:12px;box-shadow:0 0 0 1px #000,inset 0 0 0 1px #ffffff0d,0 10px 30px #000a}
input{background:#0e0b08;border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:10px 12px;font:inherit;width:100%;user-select:text;-webkit-user-select:text}
.screen{position:fixed;inset:0;overflow:auto}
/* menu */
#menu{background:radial-gradient(ellipse at 50% 120%,#c0602a 0%,#4a1e14 30%,#120c10 65%,#07060a 100%);display:flex;align-items:center;justify-content:center;padding:20px}
.menuBox{width:min(440px,100%);padding:22px}
.logo{text-align:center;margin-bottom:14px}
.logo h1{font-size:40px;font-weight:800;letter-spacing:2px;background:linear-gradient(#fff3c0,#e0a040 60%,#a0501a);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 30px #ff8a2a44;margin:0}
.logo .sunrise{height:6px;margin:6px auto 0;width:70%;background:radial-gradient(ellipse at 50% 100%,#ffd070,#ff7a2a00 70%)}
.field{margin:10px 0}.field label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.rooms{margin-top:12px;max-height:180px;overflow:auto}
.room{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin:4px 0;background:#0006}
.room span:last-child{display:flex;gap:8px;align-items:center}
#ver{text-align:center;margin-top:12px;font-size:11px;color:var(--muted)}
/* lobby */
#lobby{background:radial-gradient(ellipse at 50% 0,#2a1c12,#0b0907 70%);padding:16px;display:flex;justify-content:center}
.lobbyWrap{display:grid;grid-template-columns:minmax(260px,340px) minmax(280px,460px);gap:14px;max-width:820px;width:100%;align-self:flex-start}
@media(max-width:700px){.lobbyWrap{grid-template-columns:1fr}}
.lobbyWrap .panel{padding:16px}
.code{font-family:Cinzel,serif;font-size:26px;color:var(--gold2);letter-spacing:4px}
.pRow{display:flex;align-items:center;gap:10px;padding:8px;border-bottom:1px solid #ffffff10}.pRow span:nth-child(2){flex:1}
.hPort{width:44px;height:44px;border-radius:50%;overflow:hidden;border:2px solid var(--gold);flex:none}
.hPort.sm{width:34px;height:34px;font-size:15px}.hPort.xs{width:26px;height:26px;font-size:12px;border-width:1px}
#heroPick{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:10px 0}
.heroCard{display:flex;gap:8px;align-items:center;text-align:left;padding:8px;border-radius:10px;border:1px solid var(--line);background:#0005;cursor:pointer}
.heroCard.sel{border-color:var(--hc);box-shadow:0 0 0 1px var(--hc),0 0 18px -4px var(--hc);background:#ffffff0a}
.statGrid{display:grid;grid-template-columns:1fr auto;gap:2px 12px;margin:8px 0;font-size:13px}.statGrid span{color:var(--muted)}
.abInfo{margin:8px 0;padding:8px;border-left:2px solid var(--gold);background:#0004;border-radius:0 6px 6px 0}.abInfo p{margin:4px 0 0;font-size:12px;color:#d8ccb0}
#heroInfo h3 small{display:inline;margin-left:6px}
/* game */
:root{--ui:1}
#game{position:fixed;inset:0;overflow:hidden;background:#000}
#view,#overlay{position:absolute;inset:0}#overlay{pointer-events:none}
body.dead #view{filter:grayscale(.85) brightness(.7)}
.hud{position:absolute;pointer-events:none;z-index:5}.hud *{pointer-events:auto}
.sl{left:max(10px,env(safe-area-inset-left))}.sr{right:max(10px,env(safe-area-inset-right))}
/* top-left: me */
#hudTL{top:max(8px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));transform:scale(var(--ui));transform-origin:0 0}
#meCard{display:flex;gap:8px;align-items:center;background:linear-gradient(90deg,#0d0a07e6,#0d0a0799 80%,transparent);padding:5px 14px 5px 5px;border-radius:40px 12px 12px 40px}
#xpRing{--p:0;position:relative;width:60px;height:60px;border-radius:50%;background:conic-gradient(#c8a0ff calc(var(--p)*1%),#2a2030 0);padding:3px;flex:none;cursor:pointer}
#hPortrait{width:100%;height:100%;border-radius:50%;overflow:hidden;border:2px solid var(--gold);box-sizing:border-box}
#hPortrait svg,.hPort svg,.aPort svg,.tipIcon svg,.abIcon svg,.slot svg,.iIcon svg{width:100%;height:100%;display:block}
#lvl{position:absolute;bottom:-3px;right:-3px;min-width:22px;height:22px;border-radius:11px;background:#1a1208;border:1.5px solid var(--gold);font:800 12px/19px Inter;text-align:center;color:var(--gold2)}
.bars{display:flex;flex-direction:column;gap:3px;width:150px}
.barO{position:relative;height:13px;background:#1a0a0a;border-radius:3px;overflow:hidden;box-shadow:0 0 0 1px #000,inset 0 1px 2px #000}
.barO.rs{height:9px}.barO .fill{height:100%;transition:width .15s}.barO span{position:absolute;inset:0;font:700 9.5px/13px Inter;text-align:center;text-shadow:0 1px 2px #000,0 0 3px #000}.barO.rs span{font-size:8px;line-height:9px}
#hpFill{background:linear-gradient(#7af08a,#2aa03a 60%,#1a7a2a)} .res-Mana{background:linear-gradient(#7ab0ff,#2a5ad0)}.res-Rage{background:linear-gradient(#ff7a6a,#b02a1a)}.res-Energy{background:linear-gradient(#fff07a,#c8a01a)}.res-Resolve{background:linear-gradient(#ffc06a,#c0701a)}
#buffs{display:flex;flex-wrap:wrap;gap:3px;min-height:4px}.buff{font:700 8.5px Inter;padding:1px 5px;border-radius:6px;background:#000a;color:var(--gold2);border:1px solid #ffffff22}.buff.ward{color:#9fd0ff}.buff.mem{color:#ffc62a}
#allies{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.ally{display:flex;gap:6px;align-items:center;background:#0009;padding:3px 10px 3px 3px;border-radius:20px;width:150px}.ally.isDead{opacity:.6}
.aPort{position:relative;width:30px;height:30px;border-radius:50%;overflow:hidden;border:1.5px solid var(--gold);flex:none}.aPort b{position:absolute;bottom:-1px;right:0;font:800 8px Inter;background:#000c;padding:0 2px;border-radius:3px;color:var(--gold2)}
.aInfo{flex:1;font:600 10px Inter}.mini-bar{height:5px;background:#3a0a0a;border-radius:2px;overflow:hidden;margin-top:2px}.mini-bar div{height:100%;background:linear-gradient(#7af08a,#2aa03a)}.dead{color:#ff8a7a;font-size:9px}
/* top center */
#hudTop{top:max(6px,env(safe-area-inset-top));left:50%;transform:translateX(-50%) scale(var(--ui));transform-origin:50% 0;display:flex;gap:6px;align-items:stretch}
#clock{display:flex;align-items:center;gap:6px;padding:4px 12px;border-radius:16px;background:#0d0a07d9;border:1px solid #5a4a30;font:700 13px Inter}
#clock small{color:var(--muted);font:600 10px Inter}
#clock.night{border-color:#5a6acc;box-shadow:0 0 14px -4px #6a7aff}
.sunI{color:#ffcf4a;font-size:15px}.moon{color:#b8c8ff;font-size:15px}
#gold{padding:4px 12px 4px 26px;border-radius:16px;background:#0d0a07d9 radial-gradient(circle at 13px 50%,#ffe27a 0 5px,#b8862a 6px,transparent 7px) no-repeat;border:1px solid #5a4a30;font:800 13px/20px Inter;color:var(--gold2)}
#feed{top:calc(max(8px,env(safe-area-inset-top)) + 150px*var(--ui));left:max(10px,env(safe-area-inset-left));width:min(260px,32vw);display:flex;flex-direction:column;align-items:flex-start;gap:2px;pointer-events:none}
.msg{font:600 10px/1.25 Inter;padding:2px 7px;border-radius:4px;background:#0008;text-align:left;transition:opacity .8s;pointer-events:none;text-shadow:0 1px 2px #000}
.msg.fade{opacity:0}.c-gold{color:var(--gold2)}.c-r{color:#ff8a7a}.c-p{color:#b8c0ff}.c-w{color:#eee}
.c-r3{color:#3a8dff}.c-r4{color:#b05bff}.c-r5{color:#ffc62a;text-shadow:0 0 8px #ffc62a88}.c-r6{color:#ff3434;text-shadow:0 0 10px #ff343488;font-weight:800}
#nightWarn{top:calc(max(6px,env(safe-area-inset-top)) + 36px);left:50%;transform:translateX(-50%);font:800 10px Inter;color:#ff7070;letter-spacing:.5px;text-shadow:0 0 6px #f00,0 1px 2px #000;pointer-events:none;white-space:nowrap;background:#2a000088;padding:2px 10px;border-radius:8px}
/* top right: minimap */
#hudTR{top:max(8px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));display:flex;gap:6px;align-items:flex-start;transform:scale(var(--ui));transform-origin:100% 0}
#minimap{width:150px;height:169px;border:2px solid #8a7040;border-radius:10px;box-shadow:0 0 0 1px #000,0 4px 16px #000c;touch-action:none;background:#000}
#sideBtns{display:flex;flex-direction:column;gap:5px}
.ibtn{width:38px;height:38px;border-radius:50%;padding:0;background:radial-gradient(circle at 50% 35%,#3a2e1e,#140f09);border:1.5px solid #8a7040;font-size:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;color:var(--gold2);box-shadow:0 2px 6px #000a;position:relative}
.ibtn small{font:700 7.5px Inter;margin-top:1px;color:#d8ccb0}
.ibtn.glow{border-color:var(--gold2);box-shadow:0 0 12px 0 var(--gold);animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 20px 2px var(--gold)}}
/* joystick */
#joy{position:absolute;width:calc(124px*var(--ui));height:calc(124px*var(--ui));margin:calc(-62px*var(--ui)) 0 0 calc(-62px*var(--ui));border-radius:50%;background:radial-gradient(circle,#ffffff10 40%,#ffffff22 70%,#ffffff10);border:2px solid #ffffff40;pointer-events:none;z-index:4;left:calc(max(10px,env(safe-area-inset-left)) + 100px*var(--ui));top:calc(100% - 100px*var(--ui));opacity:.45;transition:opacity .15s}
#joy.on{opacity:1}
#joyKnob{position:absolute;left:50%;top:50%;width:46%;height:46%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#c8d4e8 50%,#7a8aa8);box-shadow:0 2px 10px #000a;transform:translate(-50%,-50%)}
#joyHint{left:calc(max(10px,env(safe-area-inset-left)) + 100px*var(--ui));bottom:calc(14px*var(--ui));transform:translateX(-50%);font:700 9px Inter;color:#ffffff70;pointer-events:none;letter-spacing:1px;text-transform:uppercase}
#joy.on~#joyHint{display:none}
/* bottom center */
#hudBC{bottom:max(6px,env(safe-area-inset-bottom));left:50%;transform:translateX(-58%) scale(var(--ui));transform-origin:50% 100%;display:flex;gap:6px;align-items:center}
#inv{display:flex;gap:3px;cursor:pointer;background:#0008;padding:3px;border-radius:8px}
.slot{width:28px;height:28px;border:1.5px solid #4a3e2a;border-radius:6px;background:#0009;overflow:hidden}
.ibtn.small{width:40px;height:40px}.ibtn.small b{position:absolute;top:-2px;right:-2px;font:800 10px Inter;background:#1a1208;border:1px solid var(--gold);border-radius:8px;padding:0 4px}
.ibtn.empty{filter:grayscale(1);opacity:.6}
/* bottom right: combat */
#hudBR{right:max(14px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));width:300px;height:250px;transform:scale(var(--ui));transform-origin:100% 100%}
#btnAtk{position:absolute;right:0;bottom:0;width:92px;height:92px;border-radius:50%;border:3px solid #d9b25f;background:radial-gradient(circle at 50% 35%,#5a3a1a,#1a0e06);box-shadow:0 0 0 2px #000,0 6px 18px #000c,inset 0 2px 6px #ffffff22;padding:20px;cursor:pointer;touch-action:none}
#btnAtk svg{width:100%;height:100%}
#btnAtk:active,#btnAtk.fire{transform:scale(.93)}
.abw{position:absolute;width:62px;height:62px}
#abQ{right:108px;bottom:2px}#abW{right:98px;bottom:82px}#abE{right:28px;bottom:112px}#abR{right:178px;bottom:58px;width:68px;height:68px}
.ab{position:relative;width:100%;height:100%;border-radius:50%;border:2.5px solid #8a7040;background:#140f09;cursor:pointer;overflow:hidden;padding:0;touch-action:none;box-shadow:0 0 0 2px #000,0 4px 12px #000b}
.ult .ab{border-color:#ff9a4a}
.abIcon{position:absolute;inset:0}.cdOv{position:absolute;inset:0;border-radius:50%}
.cdTxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:900 20px Inter;color:#fff;text-shadow:0 0 4px #000,0 0 2px #000}
.abKey{position:absolute;bottom:2px;left:0;right:0;text-align:center;font:800 9px Inter;color:#fff;text-shadow:0 0 3px #000}
.ab.locked .abIcon{filter:grayscale(.85) brightness(.6)}.ab.locked{border-color:#4a4030}.ab.nores .abIcon{filter:saturate(.3) brightness(.6)}.ab.nores{border-color:#3a5aff}
.ab.ready{border-color:var(--gold2);box-shadow:0 0 0 2px #000,0 0 12px -2px var(--gold)}.ult .ab.ready{border-color:#ffb06a;box-shadow:0 0 0 2px #000,0 0 16px 0 #ff8a2a}
.ab.fire,.lvlup.fire{animation:fire .3s}@keyframes fire{40%{transform:scale(.88)}}
.pips{position:absolute;left:0;right:0;bottom:-7px;display:flex;justify-content:center;gap:2px;pointer-events:none}.pips i{width:6px;height:3px;border-radius:2px;background:#000c;border:1px solid #6a5a3a}.pips i.on{background:var(--gold2)}
.lvlup{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:28px;height:28px;border-radius:50%;background:radial-gradient(#fff3a0,#d89a1a);border:2px solid #fff4c0;color:#3a2000;font:900 18px/24px Inter;text-align:center;cursor:pointer;animation:bob 1s infinite;padding:0;z-index:2;box-shadow:0 0 10px #ffc040}
@keyframes bob{50%{transform:translateX(-50%) translateY(-3px)}}
#attrBtn{position:absolute;right:0;top:-6px}
#cancelZone{position:absolute;right:236px;top:-6px;width:52px;height:52px;border-radius:50%;border:2px dashed #ff8a7a;color:#ff8a7a;font:800 22px/48px Inter;text-align:center;opacity:0;transition:opacity .15s;pointer-events:none;background:#3a0a0a88}
#cancelZone.on{opacity:1}#cancelZone.hot{background:#c02a2a;color:#fff;border-style:solid;transform:scale(1.15)}
#hint{right:calc(max(14px,env(safe-area-inset-right)) + 20px);bottom:calc(max(12px,env(safe-area-inset-bottom)) + 262px*var(--ui));font:700 11px Inter;color:#ffd8a0;text-shadow:0 1px 3px #000,0 0 6px #000;opacity:0;pointer-events:none;max-width:260px;text-align:right}
#hint.show{animation:hintA 1.8s forwards}@keyframes hintA{0%{opacity:0;transform:translateY(4px)}10%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:3}#flash.go{animation:flashA .5s ease-out}@keyframes flashA{0%{opacity:1}100%{opacity:0}}
.ab.nope,#btnAtk.nope{animation:nope .3s}@keyframes nope{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.ab.nope{box-shadow:0 0 0 2px #000,0 0 0 4px #c0302a}
#btnAtk.held{border-color:#fff3b0;box-shadow:0 0 0 2px #000,0 0 22px 2px #ffb03a}
/* tooltip */
#abTip{right:calc(max(14px,env(safe-area-inset-right)) + 10px);bottom:calc(max(12px,env(safe-area-inset-bottom)) + 250px*var(--ui));width:min(300px,60vw);padding:10px 12px;font-size:12px;z-index:30}
#abTip p{margin:6px 0;color:#e8dcc0;line-height:1.4}
.tipHead{display:flex;gap:10px;align-items:center}.tipIcon{width:40px;height:40px;border-radius:10px;overflow:hidden;border:1.5px solid var(--gold);flex:none}.tipIcon.big{width:56px;height:56px}
.heroHead{display:flex;gap:12px;align-items:center;margin-bottom:6px}.heroHead h2{margin:0}
.abInfo.withIcon{display:flex;gap:10px;align-items:flex-start}
#channel{bottom:34%;left:50%;transform:translateX(-50%);width:220px;text-align:center;font:700 12px Inter;pointer-events:none;text-shadow:0 1px 3px #000}
#channel .barO{height:8px}#channelFill{background:linear-gradient(90deg,#6ab0ff,#c0e0ff);height:100%}
#deathOv{inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none!important}#deathOv *{pointer-events:none}
#deathTxt{font:800 26px Cinzel,serif;color:#ffb0a0;text-shadow:0 2px 10px #000;background:#0008;padding:8px 18px;border-radius:10px}
#loading{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:radial-gradient(ellipse at 50% 120%,#c0602a 0%,#4a1e14 30%,#120c10 65%,#07060a 100%)}
.logoSm{font:800 30px Cinzel,serif;background:linear-gradient(#fff3c0,#e0a040);-webkit-background-clip:text;background-clip:text;color:transparent}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid #5a4a30;border-top-color:var(--gold2);animation:sp 0.8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
#rotateHint{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:#0b0907f2;font:700 16px Inter;color:var(--gold2)}
.rotIcon{font-size:48px;animation:rot 2s infinite}@keyframes rot{30%,70%{transform:rotate(-90deg)}}
#toasts{position:fixed;top:24%;left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:4px;align-items:center;pointer-events:none}
.toast{background:#000d;border:1px solid var(--line);padding:5px 12px;border-radius:8px;font-size:12px;animation:fadeT 2.6s forwards}.toast.warn{color:#ffb07a}.toast.info{color:#9fd0ff}
@keyframes fadeT{0%{opacity:0;transform:translateY(6px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#netOv{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;background:#0008}
#btnRejoin{border-color:#7ad0ff;color:#bfe8ff}
.iIcon{width:38px;height:38px;border-radius:8px;overflow:hidden;flex:none;border:1px solid #ffffff22}.iTxt{flex:1;min-width:0}
/* modal */
#modalBg{position:fixed;inset:0;background:#000a;z-index:40;display:flex;align-items:center;justify-content:center;padding:12px}
#modal{position:relative;width:min(560px,100%);max-height:88vh;overflow:auto;padding:16px}
#modal .x{position:absolute;top:8px;right:8px;background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted)}
.status{font-size:12px;margin-bottom:8px;color:#d8ccb0}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}.tab{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:#0006;cursor:pointer;font-size:12px;font-weight:700}#modePick .tab{flex:1;text-align:left}#modePick .tab:disabled{cursor:default}
.tab.on{border-color:var(--gold);color:var(--gold2);background:#ffffff10}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border:1px solid #ffffff14;border-radius:8px;background:#0005}
.item.r5{border-color:#ffc62a66;background:linear-gradient(90deg,#ffc62a14,#0005)}.item.r6{border-color:#ff343488;background:linear-gradient(90deg,#ff343420,#0005)}.item.picked{outline:2px solid var(--gold2)}
.lore{font-style:italic;color:#c8b88a}
.laneHdr{margin-top:8px;font:800 14px Cinzel,serif;color:var(--gold2)}
.town{padding:8px 10px;border:1px solid #ffffff14;border-radius:8px;background:#0005}.town.held{border-color:#4a9aff66}
.tTop,.tMid,.tBot{display:flex;justify-content:space-between;align-items:center;gap:8px}.tMid{font-size:12px;color:#d8ccb0;margin:3px 0}
.pip{display:inline-block;width:10px;height:10px;border-radius:2px;border:1px solid var(--gold);margin-left:3px;transform:rotate(45deg)}.pip.on{background:var(--gold2);box-shadow:0 0 6px var(--gold)}
.tierBtns{display:flex;gap:6px}.railLine{font-size:11px;margin:4px 0;color:#7a6e58}.station.built{color:#d8ccb0}.station.built.ok{color:var(--gold2)}.rideRow{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.tierBtns .btn{min-width:40px;font-size:16px}
/* stats */
.tblWrap{overflow:auto;max-height:60vh;border:1px solid var(--line);border-radius:8px}
table.stats{border-collapse:collapse;width:100%;font-size:12px}
.stats th,.stats td{padding:5px 8px;border-bottom:1px solid #ffffff10;text-align:right;white-space:nowrap}
.stats th{position:sticky;top:0;background:var(--stone2);font-family:Cinzel,serif}.stats th small{font-family:Inter}
.stats td:first-child{text-align:left;color:#d8ccb0;position:sticky;left:0;background:#1c1712}
.stats td.best{color:var(--gold2);font-weight:800}
/* end */
#end{background:radial-gradient(ellipse at 50% 0,#3a2410,#0b0907 70%);display:flex;justify-content:center;padding:20px}
.endBox{width:min(820px,100%);padding:20px;align-self:flex-start;text-align:center}
#endTitle{font:800 54px Cinzel,serif;margin:0}#endTitle.win{color:#ffd36b;text-shadow:0 0 30px #ffb02a}#endTitle.lose{color:#ff6a5a;text-shadow:0 0 30px #a01a1a}
#endStats{margin:16px 0;text-align:left}
@media(max-height:500px){.ab{width:54px;height:54px}.abw:last-child .ab{width:60px;height:60px}#minimap{width:120px;height:136px}#invWrap{left:calc(max(8px,env(safe-area-inset-left)) + 132px)}#me{width:210px}#allies{top:76px}#sideBtns{bottom:calc(max(10px,env(safe-area-inset-bottom)) + 90px)}}
</style>
</head>
<body>
<div id="menu" class="screen">
  <div class="menuBox panel">
    <div class="logo"><h1>Break of Day</h1><div class="sunrise"></div><small>Hold the towns. Survive the night. Shatter the Core.</small></div>
    <div class="field"><label>Your name</label><input id="nameIn" maxlength="16"></div>
    <button class="btn wide hidden" id="btnRejoin">↻ Rejoin Match</button>
    <button class="btn wide" id="btnSolo">⚔ Play Solo</button>
    <button class="btn wide" id="btnCreate">👑 Create Co-op Room</button>
    <div class="row field"><input id="codeIn" placeholder="ROOM CODE" maxlength="6" style="text-transform:uppercase"><button class="btn" id="btnJoin" style="flex:0 0 auto">Join</button></div>
    <div class="field"><label>Open rooms</label><div id="roomList" class="rooms"><div class="muted">Connecting…</div></div></div>
    <div id="ver"></div>
  </div>
</div>
<div id="lobby" class="screen hidden">
  <div class="lobbyWrap">
    <div class="panel">
      <h2 id="lobbyTitle">War Party</h2>
      <div class="muted">Room code</div><div class="code" id="lobbyCode"></div>
      <div class="muted" style="margin-top:8px">Game mode</div><div id="modePick" class="tabs"></div>
      <div id="playerList" style="margin:10px 0"></div>
      <button class="btn wide" id="btnReady">Ready</button>
      <div class="muted" id="lobbyHint" style="margin:6px 0"></div>
      <button class="btn wide ghost" id="btnLeave">Leave</button>
    </div>
    <div class="panel">
      <h2>Choose Your Hero</h2>
      <div id="heroPick"></div>
      <div id="heroInfo"></div>
    </div>
  </div>
</div>
<div id="game" class="hidden">
  <div id="view"></div>
  <canvas id="overlay"></canvas>
  <div id="hudTL" class="hud">
    <div id="meCard">
      <div id="xpRing"><div id="hPortrait"></div><span id="lvl">1</span></div>
      <div class="bars">
        <div class="barO hp"><div class="fill" id="hpFill"></div><span id="hpTxt"></span></div>
        <div class="barO rs"><div class="fill" id="resFill"></div><span id="resTxt"></span></div>
        <div id="buffs"></div>
      </div>
    </div>
    <div id="allies"></div>
  </div>
  <div id="hudTop" class="hud">
    <div id="clock"></div>
    <div id="gold"></div>
  </div>
  <div id="feed" class="hud"></div>
  <div id="nightWarn" class="hud hidden">☾ Night Fury — lane enemies empowered</div>
  <div id="hudTR" class="hud">
    <div id="sideBtns">
      <button class="ibtn" id="btnShop" aria-label="Shop"><span>🛒</span></button>
      <button class="ibtn" id="btnTowns" aria-label="Council"><span>⚑</span></button>
      <button class="ibtn" id="btnStats" aria-label="Stats"><span>📜</span></button>
      <button class="ibtn" id="btnMenu" aria-label="Menu"><span>☰</span></button>
    </div>
    <canvas id="minimap" width="200" height="225"></canvas>
  </div>
  <div id="joy"><div id="joyKnob"></div></div>
  <div id="joyHint" class="hud">Move</div>
  <div id="hudBC" class="hud">
    <div id="inv"></div>
    <button class="ibtn small" id="btnPot"><span>🧪</span><b id="potCount">2</b></button>
    <button class="ibtn small" id="btnRecall"><span>⌂</span><small>Recall</small></button>
  </div>
  <div id="hudBR" class="hud">
    <div id="cancelZone">✕</div>
    <button class="btn sm hidden" id="attrBtn">+ Stats</button>
    <button id="btnAtk" aria-label="Attack"><svg viewBox="0 0 64 64"><path d="M14 50 L44 14 L52 12 L50 20 L18 54 Z" fill="#e8eef8" stroke="#3a3a4a" stroke-width="2"/><path d="M12 42 L22 52 M10 54 l6 -6" stroke="#c08a3a" stroke-width="5" stroke-linecap="round"/></svg></button>
    <div class="abw" id="abQ"><button class="lvlup hidden">+</button><button class="ab"><span class="abIcon"></span><span class="cdOv"></span><span class="cdTxt"></span><span class="abKey"></span></button><span class="pips"></span></div>
    <div class="abw" id="abW"><button class="lvlup hidden">+</button><button class="ab"><span class="abIcon"></span><span class="cdOv"></span><span class="cdTxt"></span><span class="abKey"></span></button><span class="pips"></span></div>
    <div class="abw" id="abE"><button class="lvlup hidden">+</button><button class="ab"><span class="abIcon"></span><span class="cdOv"></span><span class="cdTxt"></span><span class="abKey"></span></button><span class="pips"></span></div>
    <div class="abw ult" id="abR"><button class="lvlup hidden">+</button><button class="ab"><span class="abIcon"></span><span class="cdOv"></span><span class="cdTxt"></span><span class="abKey"></span></button><span class="pips"></span></div>
  </div>
  <div id="abTip" class="hud panel hidden"></div>
  <div id="hint" class="hud"></div>
  <div id="flash"></div>
  <div id="channel" class="hud hidden"><div id="channelTxt"></div><div class="barO"><div id="channelFill"></div></div></div>
  <div id="deathOv" class="hud hidden"><div id="deathTxt"></div></div>
  <div id="loading" class="hidden"><div class="logoSm">Break of Day</div><div class="spin"></div><small>Forging the world…</small></div>
  <div id="rotateHint" class="hidden"><div class="rotIcon">📱</div><b>Rotate your phone</b><small>Break of Day plays in landscape</small></div>
</div>
<div id="end" class="screen hidden">
  <div class="endBox panel">
    <h1 id="endTitle"></h1><div id="endSub" class="muted"></div>
    <div id="endStats"></div>
    <button class="btn" id="btnEndMenu">Return to Menu</button>
  </div>
</div>
<div id="netOv" class="hidden"><div class="panel" style="padding:16px;text-align:center"><div id="netTxt" style="margin-bottom:10px"></div><button class="btn sm ghost" id="netLeave">Leave match</button></div></div>
<div id="modalBg" class="hidden"><div id="modal" class="panel"></div></div>
<div id="toasts"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>window.BOD_BUILD='__BUILD__';</script>
<script>/*__SIM__*/</script>
<script>/*__ICONS__*/</script>
<script>/*__CLIENT__*/</script>
</body>
</html>
