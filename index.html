<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#14120f">
<title>Hold the Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#14120f;--panel:#1d1915;--panel2:#26201a;--line:#3a3128;--fg:#efe7d6;--muted:#a59c88;--gold:#ffd36b;--gold2:#f2b94a;--red:#e05a4a;--ok:#7ad86a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:500 14px/1.45 Inter,system-ui,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit}
.hidden{display:none!important}
.screen{position:fixed;inset:0;overflow:auto}
h1,h2,h3{font-family:Cinzel,serif;margin:0 0 8px}
.muted{color:var(--muted)}.small{font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;min-height:44px}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:linear-gradient(#ffd77a,#c08a2a);color:#2a1404;border-color:#fff0b0}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13px;border-radius:10px}
.btn.danger{border-color:#7a2a22;color:#ffb0a0}
.btn.wide{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.err{color:#ff8a7a;font-size:12px;margin:6px 0 0}.err:empty{display:none}
input.textin{width:100%;background:#0f0d0b;border:1px solid var(--line);border-radius:10px;color:var(--fg);padding:12px;font:600 16px Inter}
/* ---------- menu ---------- */
#menu{display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(ellipse at 30% 20%,#2a3a22 0%,#14120f 60%)}
.menuWrap{width:100%;max-width:920px;display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:center}
@media(max-width:720px){.menuWrap{grid-template-columns:1fr}}
.brand .title{font:900 clamp(40px,7vw,72px)/0.95 Cinzel,serif;margin:0;background:linear-gradient(180deg,#fff7d6 10%,#ffd36b 50%,#c0702a 90%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #2a1406)}
.brand p{color:var(--muted);max-width:420px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 10px 30px #0008}
.eyebrow{font:800 11px Inter;letter-spacing:2px;text-transform:uppercase;color:var(--gold2);margin-bottom:6px}
.menuPanel{display:flex;flex-direction:column;gap:10px}
.menuPanel .btn.big{min-height:58px;font-size:16px;flex-direction:column;gap:2px}
.menuPanel .btn.big small{font-weight:500;font-size:12px;opacity:.75}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#ver{position:fixed;left:12px;bottom:8px;color:#6a6252;font-size:12px}
.lobbyList{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto}
.lobbyItem{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer}
.lobbyItem b{display:block}.lobbyItem .grow{flex:1;min-width:0}
.empty{padding:20px;text-align:center;color:var(--muted)}
.spin{width:28px;height:28px;border:3px solid #ffffff22;border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;margin:10px auto}@keyframes sp{to{transform:rotate(360deg)}}
/* ---------- lobby ---------- */
#lobby{padding:14px}
.lobbyWrap{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:1.25fr 1fr;gap:14px}
@media(max-width:820px){.lobbyWrap{grid-template-columns:1fr}}
.seats{display:flex;flex-direction:column;gap:8px}
.seatHead{font:800 11px Inter;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:6px 2px 0}
.seat{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-height:54px}
.seat.open{border-style:dashed;cursor:pointer;color:var(--muted)}
.seat.open:hover{border-color:var(--gold2)}
.seat .sw{width:26px;height:26px;border-radius:7px;flex:none;box-shadow:inset 0 0 0 2px #0006}
.seat .grow{flex:1;min-width:0}.seat b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .tag{font:700 11px Inter;padding:3px 8px;border-radius:20px;background:#0006}
.seat .tag.ok{color:var(--ok)}
.seat.mine{box-shadow:0 0 0 2px var(--gold2) inset}
.maps{display:flex;gap:8px;flex-wrap:wrap}
.mapCard{flex:1 1 140px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;cursor:pointer}
.mapCard.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.mapCard:disabled{opacity:.4;cursor:default}
.mapCard b{display:block}.mapCard small{color:var(--muted)}
.mapThumb{height:54px;border-radius:8px;margin-bottom:6px;background:#2a3a22 center/cover}
.races{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.race{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 4px;font-weight:800;cursor:pointer}
.race.on{border-color:var(--gold);color:var(--gold)}
.race:disabled{opacity:.35;cursor:default}
.race small{display:block;font:600 10px Inter;color:var(--muted)}
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.swatch{height:40px;border-radius:10px;border:2px solid transparent;cursor:pointer;position:relative;box-shadow:inset 0 0 0 2px #0005}
.swatch.on{border-color:#fff;box-shadow:0 0 0 2px #000,inset 0 0 0 2px #0005}
.swatch:disabled{opacity:.25;cursor:default}
.swatch:disabled::after{content:'';position:absolute;left:8px;right:8px;top:50%;height:2px;background:#000a;transform:rotate(-30deg)}
.lobbyTop{display:flex;align-items:center;gap:10px;margin-bottom:12px;max-width:1000px;margin-left:auto;margin-right:auto}
.lobbyTop .grow{flex:1;min-width:0}
.section{margin-bottom:14px}
/* ---------- game ---------- */
#game{position:fixed;inset:0;overflow:hidden;background:#000;touch-action:none;user-select:none;-webkit-user-select:none}
#view{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;pointer-events:auto}
#topBar{top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:stretch}
.chip{background:#0d0a07d9;border:1px solid #4a3d2c;border-radius:12px;padding:5px 10px;font:700 13px Inter;display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip small{font-weight:600;color:var(--muted)}
#defChips{top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:5px}
.dchip{background:#0d0a07d9;border:1px solid #4a3d2c;border-radius:10px;padding:4px 8px 4px 6px;font:700 12px Inter;display:flex;align-items:center;gap:6px;cursor:pointer;min-width:120px}
.dchip .sw{width:12px;height:12px;border-radius:4px}
.dchip .lv{margin-left:auto;color:#ff8a8a}
.dchip.out{opacity:.45;text-decoration:line-through}
.dchip.me{border-color:var(--gold2)}
#menuBtn{top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right))}
.ibtn{width:42px;height:42px;border-radius:12px;background:#0d0a07d9;border:1px solid #4a3d2c;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#ecoBar{left:max(8px,env(safe-area-inset-left));bottom:max(8px,env(safe-area-inset-bottom));display:flex;gap:6px}
#sheet{left:50%;transform:translateX(-50%);bottom:max(8px,env(safe-area-inset-bottom));background:#120e0aee;border:1px solid #5a4a34;border-radius:16px;padding:10px;box-shadow:0 10px 30px #000c;max-width:calc(100vw - 16px)}
.sheetHead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sheetHead b{font-family:Cinzel,serif;font-size:15px}
.sheetHead .x{margin-left:auto}
.cards{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.card{flex:none;width:86px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:6px;text-align:center;cursor:pointer}
.card:disabled{opacity:.4;cursor:default}
.card canvas{width:70px;height:52px;display:block;margin:0 auto}
.card b{display:block;font-size:12px;line-height:1.2}
.card .cost{font:800 12px Inter;color:var(--gold)}
.prios{display:flex;gap:6px;flex-wrap:wrap}
.prios button{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-weight:700;cursor:pointer}
.prios button.on{border-color:var(--gold);color:var(--gold)}
#atkPanel{left:50%;transform:translateX(-50%);bottom:max(8px,env(safe-area-inset-bottom));background:#120e0aee;border:1px solid #5a4a34;border-radius:16px;padding:8px 10px;box-shadow:0 10px 30px #000c;max-width:calc(100vw - 16px);display:flex;flex-direction:column;gap:6px}
.targets{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.targets button{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:5px 9px;font:700 12px Inter;cursor:pointer;display:flex;gap:5px;align-items:center}
.targets button.on{border-color:var(--gold);color:var(--gold)}
.targets button:disabled{opacity:.35}
.targets .sw{width:10px;height:10px;border-radius:3px}
.qrow{font:600 12px Inter;color:var(--muted)}
#toasts{position:fixed;top:60px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:60;pointer-events:none}
.toast{background:#0d0a07ee;border:1px solid #5a4a34;border-radius:12px;padding:8px 14px;font-weight:700;animation:tIn .2s ease-out}
@keyframes tIn{from{transform:translateY(-8px);opacity:0}}
#modalBg{position:fixed;inset:0;background:#000a;z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}
#modal{max-width:560px;width:100%;max-height:90vh;overflow:auto}
table.stats{width:100%;border-collapse:collapse;font-size:13px}
table.stats td,table.stats th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}
table.stats td:first-child,table.stats th:first-child{text-align:left}
#netOv{position:fixed;inset:0;background:#000b;z-index:55;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}
/* portrait / narrow screens */
@media (max-width:640px){
  #topBar{left:max(8px,env(safe-area-inset-left));transform:none;right:58px;flex-wrap:wrap}
  #defChips{top:calc(max(8px,env(safe-area-inset-top)) + 46px)}
  .dchip{min-width:0}
  #topBar .chip{font-size:12px;padding:4px 8px}
  #atkPanel,#sheet{left:6px;right:6px;transform:none;max-width:none}
  .card{width:74px}.card canvas{width:60px;height:44px}
  #ecoBar{bottom:auto;top:calc(max(8px,env(safe-area-inset-top)) + 46px);left:auto;right:max(8px,env(safe-area-inset-right));flex-direction:column;align-items:flex-end}
}
</style>
</head>
<body>
<div id="menu" class="screen">
  <div class="menuWrap">
    <div class="brand">
      <div class="eyebrow">1 attacker · up to 4 defenders</div>
      <h1 class="title">Hold the Line</h1>
      <p>One player commands the horde and grows a war economy. Everyone else builds towers and holds their lane. Last lane standing wins.</p>
      <div id="menuWho" class="muted"></div>
    </div>
    <div id="menuPanel" class="menuPanel panel"></div>
  </div>
  <div id="ver"></div>
</div>

<div id="lobby" class="screen hidden">
  <div class="lobbyTop">
    <div class="grow"><div class="eyebrow" id="lobbyEyebrow"></div><h2 id="lobbyTitle" style="margin:0"></h2></div>
    <button class="btn ghost sm" id="btnLeave">Leave</button>
  </div>
  <div class="lobbyWrap">
    <div class="panel">
      <div class="section"><div class="eyebrow">Map</div><div class="maps" id="mapPick"></div></div>
      <div class="seats" id="seats"></div>
    </div>
    <div class="panel">
      <div class="section"><div class="eyebrow">Your race</div><div class="races" id="racePick"></div></div>
      <div class="section"><div class="eyebrow">Your color</div><div class="swatches" id="colorPick"></div></div>
      <button class="btn primary wide" id="btnReady">Ready</button>
      <p class="muted small" id="lobbyHint" style="margin:8px 0 0"></p>
    </div>
  </div>
</div>

<div id="game" class="hidden">
  <canvas id="view"></canvas>
  <div id="defChips" class="hud"></div>
  <div id="topBar" class="hud"><div class="chip" id="clock"></div><div class="chip" id="waveChip"></div></div>
  <button id="menuBtn" class="hud ibtn" aria-label="Menu">☰</button>
  <div id="ecoBar" class="hud"></div>
  <div id="sheet" class="hud hidden"></div>
  <div id="atkPanel" class="hud hidden"></div>
</div>

<div id="toasts"></div>
<div id="modalBg" class="hidden"><div id="modal" class="panel"></div></div>
<div id="netOv" class="hidden"><div class="spin"></div><b id="netTxt">Reconnecting…</b><button class="btn sm" id="netLeave">Leave match</button></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<script>// Shared game rules. The host's browser runs Sim; everyone else renders the host's snapshots.
(function (G) {
'use strict';
const rr = (R, a, b) => a + R() * (b - a);
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------------- players ----------------
const COLORS = [
  { id: 'red', n: 'Red', c: '#e04848' }, { id: 'blue', n: 'Blue', c: '#3a7ae0' }, { id: 'teal', n: 'Teal', c: '#22b8a8' },
  { id: 'purple', n: 'Purple', c: '#8a4ae0' }, { id: 'yellow', n: 'Yellow', c: '#f0c419' }, { id: 'orange', n: 'Orange', c: '#f07f19' },
  { id: 'green', n: 'Green', c: '#4cbb3a' }, { id: 'pink', n: 'Pink', c: '#f06aa8' }, { id: 'gray', n: 'Gray', c: '#a0a6ad' }, { id: 'brown', n: 'Brown', c: '#8a5a2c' }];
const RACES = [{ id: 'human', n: 'Human', on: true }, { id: 'orc', n: 'Orc' }, { id: 'elf', n: 'Elf' }, { id: 'dwarf', n: 'Dwarf' }];
const MAX_DEF = 4;

// ---------------- maps (pre-made; every defender gets an identical lane for fairness) ----------------
const LANE = 50; // half-width of a lane
const MAPS = [
  { id: 'greenvale', n: 'Greenvale', d: 'Winding forest roads. Every defender holds an identical lane.', on: true, theme: 'forest',
    region: { w: 1300, h: 1900 },
    path: [[650, -150], [650, 80], [430, 240], [250, 470], [360, 700], [800, 760], [1030, 960], [900, 1210], [470, 1270], [290, 1470], [440, 1690], [650, 1770], [650, 1880]] },
  { id: 'redrock', n: 'Redrock Pass', d: 'Coming soon', on: false },
  { id: 'frostfen', n: 'Frostfen', d: 'Coming soon', on: false }];
const STAGE_H = 360; // attacker staging ground above the lanes

function buildLane(map) {
  const C = map.path, P = [];
  for (let i = 0; i < C.length - 1; i++) {
    const p0 = C[Math.max(0, i - 1)], p1 = C[i], p2 = C[i + 1], p3 = C[Math.min(C.length - 1, i + 2)];
    for (let t = 0; t < 1; t += 0.1) { const t2 = t * t, t3 = t2 * t; P.push([0, 1].map(k => 0.5 * ((2 * p1[k]) + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3))); }
  }
  P.push(C[C.length - 1]);
  const seg = []; let total = 0;
  for (let i = 0; i < P.length - 1; i++) { const a = P[i], b = P[i + 1], l = Math.hypot(b[0] - a[0], b[1] - a[1]); if (l < 0.01) continue; seg.push({ a, b, l, s: total }); total += l; }
  const LUT = []; { let si = 0; for (let d = 0; d <= total + 4; d += 4) { while (si < seg.length - 1 && d > seg[si].s + seg[si].l) si++; const s = seg[si], t = Math.min(1, Math.max(0, (d - s.s) / s.l)); LUT.push([s.a[0] + (s.b[0] - s.a[0]) * t, s.a[1] + (s.b[1] - s.a[1]) * t, Math.atan2(s.b[1] - s.a[1], s.b[0] - s.a[0])]); } }
  const at = d => { const f = Math.max(0, Math.min(LUT.length - 1.001, d / 4)), i = f | 0, t = f - i, A = LUT[i], B = LUT[i + 1]; let da = B[2] - A[2]; da = Math.atan2(Math.sin(da), Math.cos(da)); return [A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + da * t]; };
  const dist = (px, py) => { let m = 1e9; for (const s of seg) { const vx = s.b[0] - s.a[0], vy = s.b[1] - s.a[1], t = Math.max(0, Math.min(1, ((px - s.a[0]) * vx + (py - s.a[1]) * vy) / (s.l * s.l))); m = Math.min(m, Math.hypot(px - s.a[0] - vx * t, py - s.a[1] - vy * t)); } return m; };
  // build pads: two rows along both sides of the lane
  const W = map.region.w, H = map.region.h, pads = [];
  for (let d = 120; d < total - 160; d += 48) {
    const [px, py, a] = at(d);
    for (const side of [-1, 1]) for (const off of [LANE + 44, LANE + 124]) {
      const x = px + Math.cos(a + Math.PI / 2) * side * off, y = py + Math.sin(a + Math.PI / 2) * side * off;
      if (x < 40 || y < 30 || x > W - 40 || y > H - 120) continue;
      if (dist(x, y) < LANE + 34) continue;
      if (pads.some(p => Math.hypot(p.x - x, p.y - y) < 74)) continue;
      pads.push({ x: Math.round(x), y: Math.round(y) });
    }
  }
  pads.forEach((p, i) => p.id = i);
  return { P, seg, total, at, dist, pads, castle: { x: C[C.length - 1][0], y: H - 70 }, gate: { x: C[0][0], y: 0 } };
}
const LANES = {}; for (const m of MAPS) if (m.on) LANES[m.id] = buildLane(m);
function worldOf(mapId, nDef) { const m = MAPS.find(x => x.id === mapId) || MAPS[0]; return { W: m.region.w * nDef, H: m.region.h, top: -STAGE_H, rw: m.region.w }; }

// ---------------- Human race ----------------
const TOWERS = {
  archer: { n: 'Archer Tower', cost: 60, r: 190, cd: 0.5, dmg: 26, dt: 'phys', d: 'Fast single-target arrows.' },
  cannon: { n: 'Cannon', cost: 100, r: 175, cd: 1.6, dmg: 52, splash: 46, dt: 'blast', d: 'Slow shells that hit everything nearby.' },
  frost: { n: 'Frost Spire', cost: 90, r: 160, cd: 1.0, dmg: 30, slow: 1.6, dt: 'ice', d: 'Chills its target, slowing it by half.' },
  flame: { n: 'Flame Brazier', cost: 120, r: 165, dps: 62, dt: 'fire', d: 'A burning beam that melts one target.' },
  storm: { n: 'Storm Spire', cost: 140, r: 175, cd: 1.3, dmg: 40, chain: 5, dt: 'shock', d: 'Lightning that arcs to up to 5 enemies.' },
};
const TOWER_IDS = Object.keys(TOWERS);
const UNITS = {
  grunt: { n: 'Footman', hp: 150, sp: 60, r: 5.5, cost: 3, bounty: 1, leak: 1, d: 'Cheap and sturdy.' },
  runner: { n: 'Scout', hp: 85, sp: 105, r: 4.5, cost: 3, bounty: 1, leak: 1, d: 'Fast and fragile.' },
  brute: { n: 'Ogre', hp: 650, sp: 40, r: 8.5, cost: 12, bounty: 4, leak: 3, d: 'Huge, slow, costs 3 lives on a leak.' },
};
const UNIT_IDS = Object.keys(UNITS);
const RULES = { pulse: 15, length: 20 * 60, lives: 25, defGold: 230, defIncome: 14, atkGoldPer: 60, atkIncomePer: 30, atkGrowth: 3, investCost: 80, investGain: 12, sell: 0.7, hpPerMin: 0.05 };
const PRIORITIES = ['first', 'last', 'strong', 'close'];

// ---------------- simulation ----------------
class Sim {
  constructor(o) {
    this.R = mulberry32(o.seed || 1); this.map = MAPS.find(m => m.id === o.map && m.on) || MAPS[0]; this.lane = LANES[this.map.id];
    this.t = 0; this.tick = 0; this.nid = 1; this.over = null; this.events = []; this.towerVer = 1;
    const defs = o.players.filter(p => p.role === 'def'), atk = o.players.find(p => p.role === 'atk');
    this.N = defs.length; this.world = worldOf(this.map.id, this.N);
    this.players = {};

function enterLobbyScreen() { show('lobby'); renderLobby(); }
function openRoomChannel() {

  P.innerHTML = `<div class="targets"><span class="small muted">Send to</span><button data-tg="all" class="${atkUI.target === 'all' ? 'on' : ''}">All lanes</button>${V.defs.map(d => `<button data-tg="${d.slot}" class="${atkUI.target === d.slot ? 'on' : ''}" ${d.alive ? '' : 'disabled'}><span class="sw" style="background:${colHex(d.color)}"></span>${esc(d.name)}</button>`).join('')}
    <span style="margin-left:auto" class="chip">💰 ${A.gold}<small>+${A.income}/wave</small></span></div>
    <div class="cards">${TD.UNIT_IDS.map(k => { const cost = TD.UNITS[k].cost * Math.max(1, lanes) * atkUI.qty; return `<button class="card" data-unit="${k}" ${A.gold < cost || !lanes ? 'disabled' : ''} title="${esc(TD.UNITS[k].d)}"><span data-uprev="${k}"></span><b>${TD.UNITS[k].n}${q[k] ? ' · ' + q[k] : ''}</b><span class="cost">${cost}g</span></button>`; }).join('')}
</div>
    <div class="row"><div class="prios">${[1, 5, 10].map(n => `<button data-qty="${n}" class="${atkUI.qty === n ? 'on' : ''}">×${n}</button>`).join('')}</div>
      <button class="btn sm" data-invest ${A.gold < A.investCost ? 'disabled' : ''} style="margin-left:auto">Invest ${A.investCost}g<small style="font-weight:600">&nbsp;+${TD.RULES.investGain * V.defs.length}/wave</small></button></div>
    <div class="qrow">Next wave: ${Object.keys(q).length ? Object.entries(q).map(([k, n]) => n + ' ' + TD.UNITS[k].n).join(', ') : 'nothing queued yet'}</div>`;
  P.querySelectorAll('[data-uprev]').forEach(s => s.replaceWith(previewCanvas(g => { const S = sprite(s.dataset.uprev, 'n', 1, 0, V.atkCol), sz = 100 * S.size / (TD.UNITS.brute.r * 4.4); g.drawImage(S.c, 42 - sz / 2, 66 - sz * 0.72, sz, sz); })));
  P.querySelectorAll('[data-tg]').forEach(b => b.onclick = () => { atkUI.target = b.dataset.tg === 'all' ? 'all' : +b.dataset.tg; if (atkUI.target !== 'all') lookAtLane(atkUI.target); P.dataset.key = ''; renderAtk(); });
  P.querySelectorAll('[data-qty]').forEach(b => b.onclick = () => { atkUI.qty = +b.dataset.qty; P.dataset.key = ''; renderAtk(); });
  P.querySelectorAll('[data-unit]').forEach(b => b.onclick = () => send({ c: 'send', k: b.dataset.unit, lane: atkUI.target, n: atkUI.qty }));
  const iv = P.querySelector('[data-invest]'); if (iv) iv.onclick = () => send({ c: 'invest' });
}
$('menuBtn').onclick = () => openModal(`<h2>Menu</h2><p class="muted">One finger drags the map, two fingers pinch to zoom.${V && V.myDef ? ' Tap an empty stone pad on your lane to build; tap a tower to set its target or sell it.' : ''}${V && V.isAtk ? ' Pick a lane, tap units to queue them, and they march out every ' + TD.RULES.pulse + ' seconds.' : ''}</p><div class="row"><button class="btn" id="mResume">Resume</button><button class="btn danger" id="mQuit">Leave match</button></div>`, () => { $('mResume').onclick = closeModal; $('mQuit').onclick = () => { closeModal(); quitGame(); }; });
function quitGame() { endGame(); V = null; $('atkPanel').classList.add('hidden'); if (L.mode === 'solo') { L.mode = null; show('menu'); renderMenu(); } else leaveLobby(); }
function showEnd() {
  if (!V || !V.over) return; const atkWin = V.over.winner === 'atk', meAtk = V.isAtk, won = meAtk ? atkWin : (V.me && !atkWin);
  const st = V.stats;
  openModal(`<div class="eyebrow">${V.me ? (won ? 'Victory' : 'Defeat') : 'Match over'}</div><h2>${atkWin ? esc(V.atk.name) + ' broke every lane' : 'The line held'}</h2>
    ${st ? `<table class="stats"><tr><th>Defender</th><th>Kills</th><th>Leaks</th><th>Towers</th><th>Lives</th></tr>${V.defs.map((d, i) => `<tr><td><span style="color:${colHex(d.color)}">■</span> ${esc(d.name)}</td><td>${st.defs[i].kills}</td><td>${st.defs[i].leaks}</td><td>${st.defs[i].built}</td><td>${st.defs[i].lives}</td></tr>`).join('')}</table>
    <p class="muted small">${esc(V.atk.name)} sent ${st.atk.sent} units, ${st.atk.leaked} got through, invested ${st.atk.invest} times.</p>` : ''}
    <button class="btn primary" id="mBack">Back to menu</button>`, () => { $('mBack').onclick = () => { closeModal(); quitGame(); }; });
}

// ---------- frame ----------
let lastF = performance.now();
function frame(ms) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (ms - lastF) / 1000); lastF = ms;
  if (!GS.running || !V) return;
  V.clock = (V.clock || 0) + dt;
  if (!V.over) stepFx(dt);
  if (GS.mode === 'client' && performance.now() - GS.lastNet > 6000) { $('netOv').classList.remove('hidden'); $('netTxt').textContent = 'Waiting for the host…'; } else $('netOv').classList.add('hidden');
  const z = cam.z, vx0 = cam.x - VW / 2 / z, vy0 = cam.y - VH / 2 / z, vx1 = cam.x + VW / 2 / z, vy1 = cam.y + VH / 2 / z, inView = (px, py, m) => px > vx0 - m && px < vx1 + m && py > vy0 - m && py < vy1 + m;
  x.setTransform(DPR, 0, 0, DPR, 0, 0); x.fillStyle = '#1a1712'; x.fillRect(0, 0, VW, VH);
  x.setTransform(DPR * z, 0, 0, DPR * z, -vx0 * DPR * z, -vy0 * DPR * z);
  const RW = V.world.rw, top = -TD.STAGE_H;
  for (const D of V.defs) { if (D.ox + RW < vx0 || D.ox > vx1) continue; const sy = Math.max(top, vy0), ey = Math.min(V.world.H, vy1); if (ey <= sy) continue; x.drawImage(regionBg, 0, sy - top, RW, ey - sy, D.ox, sy, RW, ey - sy); if (!D.alive) { x.fillStyle = 'rgba(20,16,12,.45)'; x.fillRect(D.ox, sy, RW, ey - sy); } }
  for (const t of V.tiles.values()) if (t.x < vx1 && t.x + TILE > vx0 && t.y < vy1 && t.y + TILE > vy0) x.drawImage(t.c, t.x, t.y, TILE, TILE);
  // pads glow for building
  if (V.myDef && V.myDef.alive && sheetKind !== 'tower') { const D = V.myDef, used = new Set(V.towers.filter(t => t.slot === D.slot).map(t => t.pad)), pulse = 0.35 + 0.25 * Math.sin(V.clock * 4); x.lineWidth = 2.5; V.lane.pads.forEach((p, i) => { if (used.has(i) || !inView(p.x + D.ox, p.y, 30)) return; const sel = V.sel && V.sel.pad === i; x.strokeStyle = sel ? '#ffe08a' : `rgba(255,224,138,${pulse * (D.gold >= 60 ? 1 : 0.35)})`; x.beginPath(); x.ellipse(p.x + D.ox, p.y, 26, 12, 0, 0, 7); x.stroke(); }); }
  for (const D of V.defs) if (inView(D.ox + RW / 2, -150, RW)) drawCamp(D);
  for (const D of V.defs) if (inView(D.ox + V.lane.castle.x, V.lane.castle.y, 160)) drawCastle(D);
  // range ring for the selected tower
  if (V.sel && V.sel.tower) { const t = V.towerMap && V.towerMap.get(V.sel.tower); if (t) { x.fillStyle = 'rgba(255,224,138,.08)'; x.strokeStyle = 'rgba(255,224,138,.6)'; x.lineWidth = 2; x.beginPath(); x.arc(t.x, t.y, TD.TOWERS[t.k].r, 0, 7); x.fill(); x.stroke(); } }
  // unit shadows in one batch
  x.fillStyle = 'rgba(0,0,0,.28)'; x.beginPath(); for (const u of V.units.values()) if (inView(u.x, u.y, 20)) { x.moveTo(u.x + 3 + u.r * 1.1, u.y + u.r * 0.9); x.ellipse(u.x + 3, u.y + u.r * 0.9, u.r * 1.1, u.r * 0.45, 0, 0, 7); } x.fill();
  const list = [];
  for (const t of V.towers) if (inView(t.x, t.y, 60)) list.push([t.y + 10, 0, t]);
  for (const u of V.units.values()) if (inView(u.x, u.y, 20)) list.push([u.y, 1, u]);
  for (const c of V.corpses) if (inView(c.x, c.y, 30)) list.push([c.y, 2, c]);
  for (const p of V.parts) if (!p.p && !p.rest && inView(p.x, p.y, 30)) list.push([p.y, 3, p]);
  list.sort((a, b) => a[0] - b[0]);
  for (const [, k, o] of list) {
    if (k === 0) drawTower(o, V.clock);
    else if (k === 1) { const ph = V.clock * o.sp / 6 + o.ph, fr = Math.floor(((ph / (Math.PI * 2)) % 1 + 1) % 1 * WALK), st = (o.f & 1) ? 'slow' : (o.f & 2) ? 'burn' : 'n'; drawSprite(sprite(o.k, st, Math.cos(o.a) >= 0 ? 1 : -1, fr, V.atkCol), o.x, o.y - Math.abs(Math.sin(ph)) * 1.5, 0); }
    else if (k === 2) drawCorpse(o); else drawGib(o);
  }
  if (z > 0.5) { x.fillStyle = '#000a'; for (const u of V.units.values()) if (u.hp < 100 && inView(u.x, u.y, 20)) x.fillRect(u.x - u.r * 1.3 - 0.5, u.y - u.r * 2.3 - 0.5, u.r * 2.6 + 1, 3); for (const u of V.units.values()) if (u.hp < 100 && inView(u.x, u.y, 20)) { x.fillStyle = u.hp > 40 ? '#6ae06a' : '#e0503a'; x.fillRect(u.x - u.r * 1.3, u.y - u.r * 2.3, u.r * 2.6 * u.hp / 100, 2); } }
  for (let i = 0; i < V.beams.length; i += 2) { const t = V.towerMap && V.towerMap.get(V.beams[i]), b = V.units.get(V.beams[i + 1]); if (!t || !b || !inView(t.x, t.y, 200)) continue; const fl = 0.7 + 0.3 * Math.sin(V.clock * 40); x.strokeStyle = `rgba(255,90,40,${0.45 * fl})`; x.lineWidth = 6; x.lineCap = 'round'; x.beginPath(); x.moveTo(t.x, t.y - 26); x.lineTo(b.x, b.y - b.r); x.stroke(); x.strokeStyle = '#fff0c0'; x.lineWidth = 2; x.stroke(); }
  for (const s of V.shots) { if (!inView(s.x, s.y, 20)) continue; if (s.k === 'cannon') { x.fillStyle = '#1e1e22'; x.beginPath(); x.arc(s.x, s.y - s.h + 6, 4.5, 0, 7); x.fill(); continue; } x.save(); x.translate(s.x, s.y - s.h + 16); x.rotate(s.a || 0); if (s.k === 'archer') { x.strokeStyle = '#3a2a1a'; x.lineWidth = 1.6; x.beginPath(); x.moveTo(-8, 0); x.lineTo(6, 0); x.stroke(); x.fillStyle = '#ccc'; x.fillRect(5, -1.5, 3, 3); } else { x.fillStyle = '#c8f0ff'; x.beginPath(); x.moveTo(7, 0); x.lineTo(0, -3.5); x.lineTo(-5, 0); x.lineTo(0, 3.5); x.fill(); } x.restore(); }
  for (const p of V.parts) { if (!p.p || !inView(p.x, p.y, 20)) continue; const q = p.life / p.max; x.globalAlpha = 1 - q * q;
    if (p.kind === 'blood') { x.fillStyle = BLOOD[1]; x.fillRect(p.x - p.size / 2, p.y - p.z - p.size / 2, p.size, p.size); }
    else if (p.kind === 'ash') { x.fillStyle = p.col; x.fillRect(p.x - p.size / 2, p.y - p.z - p.size / 2, p.size, p.size); }
    else if (p.kind === 'flame') { x.fillStyle = q < 0.4 ? '#ffe08a' : '#ff7a2a'; x.beginPath(); x.arc(p.x, p.y - p.z, 2.5 * (1 - q) + 0.8, 0, 7); x.fill(); }
    else { x.fillStyle = p.col; x.beginPath(); x.arc(p.x, p.y - p.z, p.size * (1 - q * 0.5), 0, 7); x.fill(); } }
  x.globalAlpha = 1;
  for (const f of V.fx) {
    const dur = f.k === 'boom' ? 0.45 : f.k === 'bolt' ? 0.22 : f.k === 'leak' ? 1.2 : f.k === 'build' ? 0.6 : 0.35, p = (V.clock - f.t0) / dur; x.globalAlpha = Math.max(0, 1 - p);
    if (f.k === 'boom') { const r = f.small ? 0.5 : 1; x.fillStyle = '#ffb040'; x.beginPath(); x.arc(f.x, f.y, (10 + p * 40) * r, 0, 7); x.fill(); x.fillStyle = '#fff2b0'; x.beginPath(); x.arc(f.x, f.y, (6 + p * 18) * r, 0, 7); x.fill(); }
    else if (f.k === 'ice') { x.strokeStyle = '#bff0ff'; x.lineWidth = 2; x.beginPath(); for (let i = 0; i < 6; i++) { const a = i * 1.047; x.moveTo(f.x, f.y); x.lineTo(f.x + Math.cos(a) * (5 + p * 13), f.y + Math.sin(a) * (5 + p * 13)); } x.stroke(); }
    else if (f.k === 'bolt') { for (const [w, c] of [[5, 'rgba(120,200,255,.5)'], [2, '#ffffff']]) { x.strokeStyle = c; x.lineWidth = w; x.beginPath(); f.pts.forEach((pt, i) => { if (!i) { x.moveTo(pt[0], pt[1]); return; } const a = f.pts[i - 1]; for (let k2 = 1; k2 <= 4; k2++) { const t = k2 / 4, j = k2 < 4 ? 6 : 0; x.lineTo(a[0] + (pt[0] - a[0]) * t + rr(-j, j), a[1] + (pt[1] - a[1]) * t + rr(-j, j)); } }); x.stroke(); } }
    else if (f.k === 'build') { x.strokeStyle = f.col; x.lineWidth = 3; x.beginPath(); x.ellipse(f.x, f.y, 20 + p * 30, (20 + p * 30) * 0.45, 0, 0, 7); x.stroke(); }
    else if (f.k === 'leak') { x.font = '900 34px Inter'; x.textAlign = 'center'; x.fillStyle = '#000'; x.fillText('-' + f.n + ' ♥', f.x + 2, f.y - p * 40 + 2); x.fillStyle = '#ff5a4a'; x.fillText('-' + f.n + ' ♥', f.x, f.y - p * 40); }
    x.globalAlpha = 1;
  }
  renderHUD();
}
requestAnimationFrame(frame);

function tryReload(v) { let tried = null; try { tried = sessionStorage.getItem('td_reload_for'); } catch (e) { } if (tried === v) return false; try { sessionStorage.setItem('td_reload_for', v); } catch (e) { } location.replace(location.pathname + '?v=' + v); return true; }
async function checkVersion() { if (BUILD === 'dev' || location.protocol === 'file:') return; try { const v = (await (await fetch('version.json?t=' + Date.now(), { cache: 'no-store' })).json()).version; if (v && v !== BUILD && !GS.running && !L.mode) tryReload(v); } catch (e) { } }
setInterval(checkVersion, 60000); document.addEventListener('visibilitychange', () => { if (!document.hidden) checkVersion(); });
$('netLeave').onclick = () => { $('netOv').classList.add('hidden'); quitGame(); };
window.addEventListener('load', () => { $('ver').textContent = 'v' + VER; $('ver').title = 'build ' + BUILD; show('menu'); renderMenu(); checkVersion(); });
window.TDC = { get V() { return V; }, GS, L, get LS() { return LS; }, cam, send, req, onTap, lookAtLane, renderAtk };
})();
