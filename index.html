<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#14120f">
<title>Hold the Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#14120f;--panel:#1d1915;--panel2:#26201a;--line:#3a3128;--fg:#efe7d6;--muted:#a59c88;--gold:#ffd36b;--gold2:#f2b94a;--red:#e05a4a;--ok:#7ad86a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:500 14px/1.45 Inter,system-ui,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit}
.hidden{display:none!important}
.screen{position:fixed;inset:0;overflow:auto}
h1,h2,h3{font-family:Cinzel,serif;margin:0 0 8px}
.muted{color:var(--muted)}.small{font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;min-height:44px}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:linear-gradient(#ffd77a,#c08a2a);color:#2a1404;border-color:#fff0b0}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13px;border-radius:10px}
.btn.danger{border-color:#7a2a22;color:#ffb0a0}
.btn.wide{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.err{color:#ff8a7a;font-size:12px;margin:6px 0 0}.err:empty{display:none}
input.textin{width:100%;background:#0f0d0b;border:1px solid var(--line);border-radius:10px;color:var(--fg);padding:12px;font:600 16px Inter}
/* ---------- menu ---------- */
#menu{display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(ellipse at 30% 20%,#2a3a22 0%,#14120f 60%)}
.menuWrap{width:100%;max-width:920px;display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:center}
@media(max-width:720px){.menuWrap{grid-template-columns:1fr}}
.brand .title{font:900 clamp(40px,7vw,72px)/0.95 Cinzel,serif;margin:0;background:linear-gradient(180deg,#fff7d6 10%,#ffd36b 50%,#c0702a 90%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #2a1406)}
.brand p{color:var(--muted);max-width:420px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 10px 30px #0008}
.eyebrow{font:800 11px Inter;letter-spacing:2px;text-transform:uppercase;color:var(--gold2);margin-bottom:6px}
.menuPanel{display:flex;flex-direction:column;gap:10px}
.menuPanel .btn.big{min-height:58px;font-size:16px;flex-direction:column;gap:2px}
.menuPanel .btn.big small{font-weight:500;font-size:12px;opacity:.75}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#ver{position:fixed;left:12px;bottom:8px;color:#6a6252;font-size:12px}
.lobbyList{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto}
.lobbyItem{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer}
.lobbyItem b{display:block}.lobbyItem .grow{flex:1;min-width:0}
.empty{padding:20px;text-align:center;color:var(--muted)}
.spin{width:28px;height:28px;border:3px solid #ffffff22;border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;margin:10px auto}@keyframes sp{to{transform:rotate(360deg)}}
/* ---------- lobby ---------- */
#lobby{padding:14px}
.lobbyWrap{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:1.25fr 1fr;gap:14px}
@media(max-width:820px){.lobbyWrap{grid-template-columns:1fr}}
.seats{display:flex;flex-direction:column;gap:8px}
.seatHead{font:800 11px Inter;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:6px 2px 0}
.seat{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-height:54px}
.seat.open{border-style:dashed;cursor:pointer;color:var(--muted)}
.seat.open:hover{border-color:var(--gold2)}
.seat .sw{width:26px;height:26px;border-radius:7px;flex:none;box-shadow:inset 0 0 0 2px #0006}
.seat .grow{flex:1;min-width:0}.seat b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .tag{font:700 11px Inter;padding:3px 8px;border-radius:20px;background:#0006}
.seat .tag.ok{color:var(--ok)}
.seat.mine{box-shadow:0 0 0 2px var(--gold2) inset}
.maps{display:flex;gap:8px;flex-wrap:wrap}
.mapCard{flex:1 1 140px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;cursor:pointer}
.mapCard.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.mapCard:disabled{opacity:.4;cursor:default}
.mapCard b{display:block}.mapCard small{color:var(--muted)}
.mapThumb{height:54px;border-radius:8px;margin-bottom:6px;background:#2a3a22 center/cover}
.races{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.race{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 4px;font-weight:800;cursor:pointer}
.race.on{border-color:var(--gold);color:var(--gold)}
.race:disabled{opacity:.35;cursor:default}
.race small{display:block;font:600 10px Inter;color:var(--muted)}
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.swatch{height:40px;border-radius:10px;border:2px solid transparent;cursor:pointer;position:relative;box-shadow:inset 0 0 0 2px #0005}
.swatch.on{border-color:#fff;box-shadow:0 0 0 2px #000,inset 0 0 0 2px #0005}
.swatch:disabled{opacity:.25;cursor:default}
.swatch:disabled::after{content:'';position:absolute;left:8px;right:8px;top:50%;height:2px;background:#000a;transform:rotate(-30deg)}
.lobbyTop{display:flex;align-items:center;gap:10px;margin-bottom:12px;max-width:1000px;margin-left:auto;margin-right:auto}
.lobbyTop .grow{flex:1;min-width:0}
.section{margin-bottom:14px}
/* ---------- game ---------- */
#game{position:fixed;inset:0;overflow:hidden;background:#000;touch-action:none;user-select:none;-webkit-user-select:none}
#view{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;pointer-events:auto}
#topBar{top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:stretch}
.chip{background:#0d0a07d9;border:1px solid #4a3d2c;border-radius:12px;padding:5px 10px;font:700 13px Inter;display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip small{font-weight:600;color:var(--muted)}
#defChips{top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:5px}
.dchip{background:#0d0a07d9;border:1px solid #4a3d2c;border-radius:10px;padding:4px 8px 4px 6px;font:700 12px Inter;display:flex;align-items:center;gap:6px;cursor:pointer;min-width:120px}
.dchip .sw{width:12px;height:12px;border-radius:4px}
.dchip .lv{margin-left:auto;color:#ff8a8a}
.dchip.out{opacity:.45;text-decoration:line-through}
.dchip.me{border-color:var(--gold2)}
#menuBtn{top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right))}
.ibtn{width:42px;height:42px;border-radius:12px;background:#0d0a07d9;border:1px solid #4a3d2c;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#ecoBar{left:max(8px,env(safe-area-inset-left));bottom:max(8px,env(safe-area-inset-bottom));display:flex;gap:6px}
#sheet{left:50%;transform:translateX(-50%);bottom:max(8px,env(safe-area-inset-bottom));background:#120e0aee;border:1px solid #5a4a34;border-radius:16px;padding:10px;box-shadow:0 10px 30px #000c;max-width:calc(100vw - 16px)}
#buildTray{left:50%;transform:translateX(-50%);bottom:max(8px,env(safe-area-inset-bottom));background:#120e0aee;border:1px solid #5a4a34;border-radius:16px;padding:10px;box-shadow:0 10px 30px #000c;max-width:calc(100vw - 16px);user-select:none;-webkit-user-select:none}
#buildTray .card{touch-action:none}
#buildBtn{right:max(8px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));font:800 15px Inter,sans-serif;color:#fff;background:linear-gradient(#3d7a2e,#2a5a20);border:1px solid #7ec36a;border-radius:14px;padding:12px 16px;box-shadow:0 6px 18px #000a;cursor:pointer}
#buildBtn.on{background:linear-gradient(#5a4a34,#3a2e20);border-color:var(--gold);color:var(--gold)}
#buildTray .card.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
#buildTray .strip{margin-top:8px;padding:7px 9px;border-radius:10px;background:#0006;border:1px solid #5a4a34;font:600 11.5px/1.35 Inter,sans-serif;color:#e8dcc6}
#buildTray .strip b{font-family:Cinzel,serif;color:#fff}
#buildTray .strip .st{display:flex;gap:10px;flex-wrap:wrap;margin-top:3px;font:800 11px Inter,sans-serif;color:var(--gold)}
#spellBar{right:max(8px,env(safe-area-inset-right));top:34%;display:flex;flex-direction:column;gap:8px}
.spell{position:relative;width:58px;height:58px;border-radius:50%;padding:0;border:2px solid #6a5a40;background:radial-gradient(circle at 40% 35%,#3a3026,#15110c);font-size:26px;line-height:50px;text-align:center;cursor:pointer;box-shadow:0 6px 18px #000a;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;color:#fff}
.spell.ready{border-color:#c9a45a}
.spell.poor{filter:grayscale(.8) brightness(.75)}
.spell.poor small{color:#ff8a7a}
.spell .cd{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(0,0,0,.74) var(--p,0%),transparent 0);pointer-events:none}
.spell .n{position:absolute;inset:0;font:800 17px Inter,sans-serif;color:#fff;line-height:54px;text-shadow:0 1px 3px #000;pointer-events:none}
.spell.armed{border-color:#ffd77a;box-shadow:0 0 0 3px #ffd77a88,0 6px 18px #000a}
.spell small{position:absolute;left:0;right:0;bottom:4px;font:800 8.5px Inter,sans-serif;color:#e8dcc6;line-height:1;pointer-events:none;text-shadow:0 1px 2px #000}
#dragCancel{left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translate(-50%,160%);width:84px;height:72px;border-radius:16px;border:2px dashed #c9a45a;background:#120e0ad8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#e8dcc6;box-shadow:0 8px 24px #000a;transition:transform .15s ease-out,background .1s,border-color .1s;pointer-events:none}
#dragCancel b{font-size:26px;line-height:1}
#dragCancel small{font:700 9.5px Inter,sans-serif;text-align:center;line-height:1.1}
#dragCancel.hot{background:#6a1a14ee;border-color:#ff8a7a;border-style:solid}
body.dragging #dragCancel{transform:translate(-50%,0);pointer-events:auto}
body.dragging #buildTray{transform:translateY(130%);opacity:0;pointer-events:none}
body.dragging #buildBtn,body.dragging #spellBar{opacity:0;pointer-events:none}
body.sheetOpen #spellBar{opacity:0;pointer-events:none}
#sheet{z-index:30}
#buildTray{transition:transform .15s ease-out,opacity .15s}
.lvRow{display:flex;align-items:center;gap:8px;margin:2px 0 0}
.lvPips{display:flex;gap:3px}.lvPips i{width:9px;height:9px;border-radius:2px;background:#3a332a;display:block}.lvPips i.on{background:var(--gold)}
.lvUp{display:flex;align-items:center;gap:10px;background:#0006;border:1px solid #5a4a34;border-radius:10px;padding:7px 9px;margin-bottom:8px}
.lvUp div{flex:1}.lvUp b{display:block;font-size:13px}.lvUp small{color:var(--muted);font-size:11.5px}
.promos{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.promo{flex:1;display:flex;gap:7px;align-items:center;border:1px dashed #5a4a34;border-radius:10px;padding:6px 8px;opacity:.6}
.promo.open{flex-basis:100%;opacity:1;border:1px solid #c8a040;background:rgba(200,160,64,.08)}.promo.open div{flex:1}.promo b{display:block;font-size:12px}.promo small{color:var(--muted);font-size:10.5px}
.sheetHead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sheetHead b{font-family:Cinzel,serif;font-size:15px}
.sheetHead .x{margin-left:auto}
.cards{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.card{flex:none;width:86px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:6px;text-align:center;cursor:pointer}
.card:disabled,.card.off{opacity:.4;cursor:default}
.card.locked{opacity:.32;filter:grayscale(1)}
.atkCards{touch-action:pan-x;overscroll-behavior-x:contain;scroll-snap-type:none;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.atkCards .card{touch-action:pan-x}
.card.sent{animation:sentPop .35s ease-out}
@keyframes sentPop{0%{transform:scale(.9);border-color:var(--gold)}100%{transform:scale(1)}}
#buildTray .card.off.sel{opacity:.65}
.card canvas{width:70px;height:52px;display:block;margin:0 auto}
.card b{display:block;font-size:12px;line-height:1.2}
.card .cost{font:800 12px Inter;color:var(--gold)}
.prios{display:flex;gap:6px;flex-wrap:wrap}
.prios button{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-weight:700;cursor:pointer}
.prios button.on{border-color:var(--gold);color:var(--gold)}
#atkPanel{left:50%;transform:translateX(-50%);bottom:max(8px,env(safe-area-inset-bottom));background:#120e0aee;border:1px solid #5a4a34;border-radius:16px;padding:8px 10px;box-shadow:0 10px 30px #000c;max-width:calc(100vw - 16px);display:flex;flex-direction:column;gap:6px}
.targets{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.targets button{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:5px 9px;font:700 12px Inter;cursor:pointer;display:flex;gap:5px;align-items:center}
.targets button.on{border-color:var(--gold);color:var(--gold)}
.targets button:disabled{opacity:.35}
.targets .sw{width:10px;height:10px;border-radius:3px}
.qrow{font:600 12px Inter;color:var(--muted)}
#toasts{position:fixed;top:60px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:60;pointer-events:none}
.toast{background:#0d0a07ee;border:1px solid #5a4a34;border-radius:12px;padding:8px 14px;font-weight:700;animation:tIn .2s ease-out}
@keyframes tIn{from{transform:translateY(-8px);opacity:0}}
#modalBg{position:fixed;inset:0;background:#000a;z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}
#modal{max-width:560px;width:100%;max-height:90vh;overflow:auto}
table.stats{width:100%;border-collapse:collapse;font-size:13px}
table.stats td,table.stats th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}
table.stats td:first-child,table.stats th:first-child{text-align:left}
#netOv{position:fixed;inset:0;background:#000b;z-index:55;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}
/* portrait / narrow screens */
@media (max-width:640px){
  #topBar{left:max(8px,env(safe-area-inset-left));transform:none;right:58px;flex-wrap:wrap}
  #defChips{top:calc(max(8px,env(safe-area-inset-top)) + 46px)}
  .dchip{min-width:0}
  #topBar .chip{font-size:12px;padding:4px 8px}
  #atkPanel,#sheet,#buildTray{left:6px;right:6px;transform:none;max-width:none}
  #buildTray .card{width:64px;padding:4px}#buildTray .card canvas{width:56px;height:41px}#buildTray .cards{gap:5px;justify-content:center}#buildTray .sheetHead span{display:none}
  .card{width:74px}.card canvas{width:60px;height:44px}
  #ecoBar{bottom:auto;top:calc(max(8px,env(safe-area-inset-top)) + 46px);left:auto;right:max(8px,env(safe-area-inset-right));flex-direction:column;align-items:flex-end}
}
.phase{font-size:11px;font-weight:800;padding:1px 6px;border-radius:8px;margin-left:4px}.phase.go{background:#3a2a10;color:#f0c419}.phase.hold{background:#1d2a3a;color:#8fc4ff}
.card .inc{display:block;font-size:10px;font-weight:700;color:#9ff08a;line-height:1.1}
.qrow.hold{color:#8fc4ff}
.chip .hoard{color:#ff9a6a;font-weight:800;margin-left:6px}
.dchip .horde{position:relative;display:inline-block;width:46px;height:12px;margin-left:6px;border-radius:6px;background:#0008;overflow:hidden;vertical-align:middle}.dchip .horde i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#6a7a8a,#b8c4d0)}.dchip .horde b{position:relative;font-size:9px;line-height:12px;padding-left:3px;color:#fff;text-shadow:0 1px 2px #000}
.atkCards .card{position:relative}.atkCards .card .lockTag{position:absolute;top:4px;left:0;right:0;text-align:center;font-size:11px;font-weight:800;color:#f0c419;z-index:1}
</style>
</head>
<body>
<div id="menu" class="screen">
  <div class="menuWrap">
    <div class="brand">
      <h1 class="title">Hold the Line</h1>
      <div id="menuWho" class="muted"></div>
    </div>
    <div id="menuPanel" class="menuPanel panel"></div>
  </div>
  <div id="ver"></div>
</div>

<div id="lobby" class="screen hidden">
  <div class="lobbyTop">
    <div class="grow"><div class="eyebrow" id="lobbyEyebrow"></div><h2 id="lobbyTitle" style="margin:0"></h2></div>
    <button class="btn ghost sm" id="btnLeave">Leave</button>
  </div>
  <div class="lobbyWrap">
    <div class="panel">
      <div class="section"><div class="eyebrow">Map</div><div class="maps" id="mapPick"></div></div>
      <div class="seats" id="seats"></div>
    </div>
    <div class="panel">
      <div class="section"><div class="eyebrow">Your race</div><div class="races" id="racePick"></div></div>
      <div class="section"><div class="eyebrow">Your color</div><div class="swatches" id="colorPick"></div></div>
      <button class="btn primary wide" id="btnReady">Ready</button>
      <p class="muted small" id="lobbyHint" style="margin:8px 0 0"></p>
    </div>
  </div>
</div>

<div id="game" class="hidden">
  <canvas id="view"></canvas>
  <div id="defChips" class="hud"></div>
  <div id="topBar" class="hud"><div class="chip" id="clock"></div><div class="chip" id="hpChip"></div></div>
  <button id="menuBtn" class="hud ibtn" aria-label="Menu">☰</button>
  <div id="ecoBar" class="hud"></div>
  <div id="sheet" class="hud hidden"></div>
  <div id="atkPanel" class="hud hidden"></div>
  <div id="buildTray" class="hud hidden"></div>
  <div id="dragCancel" class="hud"><b>✕</b><small>Drop here to cancel</small></div>
  <div id="spellBar" class="hud hidden"><button class="spell" data-spell="meteor" title="Meteor">☄️<small>Meteor</small><span class="cd"></span><span class="n"></span></button><button class="spell" data-spell="jet" title="Water Jet">💧<small>Water Jet</small><span class="cd"></span><span class="n"></span></button></div>
  <button id="buildBtn" class="hud hidden">🔨 Build</button>
</div>

<div id="toasts"></div>
<div id="modalBg" class="hidden"><div id="modal" class="panel"></div></div>
<div id="netOv" class="hidden"><div class="spin"></div><b id="netTxt">Reconnecting…</b><button class="btn sm" id="netLeave">Leave match</button></div>

  root.querySelectorAll('[data-act]').forEach(b => b.onclick = e => { e.preventDefault(); menuAct(b.dataset.act); });
  root.querySelectorAll('[data-join]').forEach(b => b.onclick = () => { goFull(); stopBrowsing(); joinLobby(b.dataset.join); });
  const nf = $('nameForm'); if (nf) nf.onsubmit = e => { e.preventDefault(); const n = cleanName($('nameIn').value); if (!n) { menuErr = 'Enter a name.'; return renderMenu(); } myName = n; store.set('name', n); menuErr = ''; homeScreen = 'home'; renderMenu(); };
  const hf = $('hostForm'); if (hf) { $('lobbyIn').oninput = e => store.set('lobbyName', e.target.value.slice(0, 28)); hf.onsubmit = e => { e.preventDefault(); goFull(); hostLobby({ name: cleanName($('lobbyIn').value).slice(0, 28) }); }; }
}
function menuAct(a) {
  menuErr = '';
  if (a === 'find' || a === 'browse' || a === 'hostForm') checkVersion(); // an out-of-date page can't see (or be seen by) players on the new version
  if (a === 'rename') { homeScreen = 'name'; return renderMenu(); }
  if (a === 'home') { stopBrowsing(); homeScreen = 'home'; return renderMenu(); }
  if (a === 'hostForm') { homeScreen = 'host'; return renderMenu(); }
  if (a === 'browse') { homeScreen = 'browse'; startBrowsing(); return renderMenu(); }
  if (a === 'find') { goFull(); return startQuick(); }
  if (a === 'cancelSearch') { stopQuick(); homeScreen = 'home'; return renderMenu(); }
  if (a === 'cancelJoin') { leaveLobby(); return; }
  if (a === 'knights') { location.href = 'knights.html?v=' + BUILD; return; }
  if (a === 'vsai') { goFull(); return enterSolo('def'); }
  if (a === 'atkai') { goFull(); return enterSolo('atk'); }
}

// ============================ LOBBY DIRECTORY ============================
let dir = { list: [], ready: false, err: '' }, browseTimer = null, hostBeat = null, advertised = null;
async function fetchLobbies() {
  const s = getSB(); if (!s) return [];
  const { data, error } = await s.rpc('bod_open_lobbies', { p_version: BUILD });
  dir.ready = true;
  if (error) dir.err = "Couldn't load lobbies. Retrying…"; else { dir.err = ''; dir.list = (data || []).filter(l => l.code !== L.code && l.mode !== 'brawl'); }
  if (homeScreen === 'browse' && !$('menu').classList.contains('hidden')) renderMenu();
  return dir.list;
}
function startBrowsing() { stopBrowsing(); dir = { list: [], ready: false, err: '' }; fetchLobbies(); browseTimer = setInterval(fetchLobbies, 5000); }
function stopBrowsing() { if (browseTimer) clearInterval(browseTimer); browseTimer = null; }
const humanCap = () => LS.seats.filter(s => s !== 'ai').length;
const humansIn = () => L.players.length;
function lobbyRow() {
  const nd = LS.seats.slice(1).filter(Boolean).length;
  // the shared directory table only allows 1-4 seats, but a lobby here can hold 5 people (attacker + 4 defenders).
  // Store a value that keeps the open/full test right (joined < n means open), and put the real count in the text.
  const cap = humanCap(), j = Math.max(1, humansIn()), n = Math.min(4, cap), open = j < cap;
  return { code: L.code, name: (L.lobbyName || `${myName}'s Lobby`).slice(0, 40), host: myName.slice(0, 20), mode: LS.map, n, joined: open ? Math.min(j, n - 1) : n, heroes: ((LS.seats[0] === 'ai' ? 'vs AI attacker' : '1v' + Math.max(1, nd)) + '|' + j + '/' + cap).slice(0, 120), version: BUILD };
}
function advertise() {
  const s = getSB(); if (!s || L.mode !== 'host' || L.started) return unadvertise();
  const beat = () => { if (L.mode !== 'host' || L.started || !L.code) return unadvertise(); s.from('bod_lobbies').upsert(lobbyRow(), { onConflict: 'code' }).then(({ error }) => { if (error) console.warn('lobby heartbeat failed', error.message); }); };
  advertised = L.code; beat(); if (!hostBeat) hostBeat = setInterval(beat, 5000);
}
function unadvertise() { if (hostBeat) clearInterval(hostBeat); hostBeat = null; const s = getSB(); if (advertised && s) { const c = advertised; advertised = null; s.from('bod_lobbies').delete().eq('code', c).then(() => { }, () => { }); } }
window.addEventListener('pagehide', () => { if (advertised) unadvertise(); });

// find match: join the fullest lobby with room; otherwise open a Quick Match lobby and keep watching for an older one to merge into
const qm = { timer: null, status: '' };
async function startQuick() {
  if (!getSB()) return; homeScreen = 'search'; qm.status = 'Looking for open lobbies.'; renderMenu();
  const list = (await fetchLobbies()).filter(l => l.joined < l.n).sort((a, b) => b.joined - a.joined || new Date(a.created_at) - new Date(b.created_at));
  if (homeScreen !== 'search') return;
  if (list.length) { qm.status = 'Joining ' + list[0].name + '…'; renderMenu(); return joinLobby(list[0].code); }
  hostLobby({ name: 'Quick Match', quick: true });
}
function stopQuick() { if (qm.timer) clearInterval(qm.timer); qm.timer = null; }
function quickWatch() {
  stopQuick();
  qm.timer = setInterval(async () => {
    if (!L.quick || L.mode !== 'host' || L.started || L.players.length > 1) return;
    const older = (await fetchLobbies()).filter(l => l.joined < l.n && l.name === 'Quick Match' && l.code !== L.code && new Date(l.created_at) < new Date(L.createdAt));
    if (older.length && L.quick && L.players.length <= 1 && !L.started) { stopQuick(); const c = older[0].code; leaveLobby(true); joinLobby(c); }
  }, 4000);
}

// ============================ LOBBY ROOM ============================
// L: my connection to a lobby. LS: the lobby's state (seats, map, picks), owned by the host and broadcast to everyone.
const L = { mode: null, code: null, ch: null, players: [], started: false, lobbyName: '', quick: false };
let LS = freshLS();
function freshLS() { return { map: 'greenvale', seats: [null, null, null, null, null], pl: {}, aiCol: {} }; }
// colours in use by players and AI seats (the AI attacker is always red)
function usedColors(exceptPid) { const u = new Set(Object.entries(LS.pl).filter(([q]) => q !== exceptPid).map(([, p]) => p.color)); if (LS.seats[0] === 'ai') u.add('red'); for (const [i, c] of Object.entries(LS.aiCol || {})) if (LS.seats[i] === 'ai') u.add(c); return u; }
const aiName = i => 'AI Defender' + (LS.seats.slice(1).filter(s => s === 'ai').length > 1 ? ' ' + i : '');
const isHost = () => L.mode === 'host' || L.mode === 'solo';
function hostLobby(o) {
  if (!getSB()) { menuErr = 'Network unavailable'; return renderMenu(); }
  Object.assign(L, { mode: 'host', started: false, players: [], code: randomCode(), lobbyName: o.name || '', quick: !!o.quick, createdAt: new Date().toISOString(), joined: Date.now() });
  LS = freshLS(); LS.pl[myPid] = { name: myName, color: myColor, race: 'human', ready: true }; LS.seats[1] = myPid;
  homeScreen = 'home'; enterLobbyScreen(); openRoomChannel(); advertise(); if (L.quick) quickWatch();
}
function joinLobby(code) {
  if (!getSB()) { menuErr = 'Network unavailable'; return renderMenu(); }
  Object.assign(L, { mode: 'client', started: false, players: [], code: String(code).toUpperCase(), joined: Date.now(), seenHost: false, quick: false });
  LS = freshLS(); homeScreen = 'joining'; renderMenu(); openRoomChannel();
  clearTimeout(L.joinTimer); L.joinTimer = setTimeout(() => { if (!L.seenHost && L.mode === 'client' && !GS.running) { leaveLobby(); menuErr = 'That lobby is no longer open.'; renderMenu(); } }, 9000);
}
function enterSolo(role) {
  Object.assign(L, { mode: 'solo', started: false, code: null, lobbyName: role === 'atk' ? 'Attack vs AI' : 'Defend vs AI', quick: false, players: [{ pid: myPid, name: myName }] });
  LS = freshLS();
  if (role === 'atk') { LS.pl[myPid] = { name: myName, color: myColor, race: 'human', ready: true }; LS.seats[0] = myPid; LS.seats[1] = 'ai'; LS.aiCol[1] = TD.COLORS.find(c => c.id !== myColor).id; }
  else { LS.pl[myPid] = { name: myName, color: myColor === 'red' ? 'blue' : myColor, race: 'human', ready: true }; LS.seats[0] = 'ai'; LS.seats[1] = myPid; }
  enterLobbyScreen();
}
function enterLobbyScreen() { show('lobby'); renderLobby(); }
function openRoomChannel() {
  const s = getSB(); if (L.ch) { try { s.removeChannel(L.ch); } catch (e) { } }
  const ch = s.channel('td-room-' + L.code, { config: { presence: { key: myPid }, broadcast: { self: false, ack: false } } });
  L.ch = ch;
  ch.on('presence', { event: 'sync' }, () => {
    if (ch !== L.ch) return;
    const st = ch.presenceState(), arr = [];
    for (const k in st) { const p = st[k][st[k].length - 1]; if (p) arr.push(p); }
    arr.sort((a, b) => (b.host ? 1 : 0) - (a.host ? 1 : 0) || a.joined - b.joined);
    L.players = arr;
    const hostP = arr.find(p => p.host);
    if (!isHost()) {
      if (hostP && !L.seenHost && !GS.running) {
        if (hostP.v !== BUILD) { menuErr = 'That lobby is on a different version. Reload the page to update, then try again.'; leaveLobby(); return; }
        if (hostP.started) { menuErr = 'That match has already started.'; leaveLobby(); return; }
        L.seenHost = true; clearTimeout(L.joinTimer); enterLobbyScreen();
      }
      if (hostP) { clearTimeout(L.hostGone); L.hostGone = null; L.lobbyName = hostP.ln || L.lobbyName; }
      if (L.seenHost && !hostP && !L.hostGone) L.hostGone = setTimeout(() => { L.hostGone = null; if (L.players.some(p => p.host)) return; if (GS.running) { endGame(); openModal('<h2>The host left</h2><p class="muted">The match ran on the host\'s device, so it has ended.</p><button class="btn primary" id="mOk">Back to menu</button>', () => $('mOk').onclick = () => { closeModal(); leaveLobby(); }); } else { leaveLobby(); menuErr = 'The host closed the lobby.'; renderMenu(); } }, GS.running ? 15000 : 3000);
      return;
    }
    if (GS.running) return;
    // host: version check, capacity, seat bookkeeping
    arr.filter(p => !p.host && p.v !== BUILD).forEach(p => ch.send({ type: 'broadcast', event: 'kick', payload: { pid: p.pid, reason: 'Different game version. Reload the page to update.' } }));
    arr.filter(p => !p.host && p.v === BUILD).slice(humanCap() - 1).forEach(p => ch.send({ type: 'broadcast', event: 'kick', payload: { pid: p.pid, reason: 'That lobby is full.' } }));
    const here = new Set(arr.filter(p => p.v === BUILD).map(p => p.pid)); here.add(myPid);
    for (const pid in LS.pl) if (!here.has(pid)) { delete LS.pl[pid]; LS.seats = LS.seats.map(s => s === pid ? null : s); }
    for (const p of arr) if (p.v === BUILD && !LS.pl[p.pid]) {
      const taken = new Set(Object.values(LS.pl).map(q => q.color)), color = !taken.has(p.color) && TD.COLORS.some(c => c.id === p.color) ? p.color : (TD.COLORS.find(c => !taken.has(c.id)) || TD.COLORS[0]).id;
      LS.pl[p.pid] = { name: cleanName(p.name) || 'Player', color, race: 'human', ready: false };
      const open = LS.seats.findIndex((s, i) => i > 0 && !s); if (open > 0) LS.seats[open] = p.pid; else if (!LS.seats[0]) LS.seats[0] = p.pid;
    }

  ch.on('broadcast', { event: 'ls' }, ({ payload }) => { if (isHost() || GS.running) return; LS = payload; if (L.seenHost) renderLobby(); });
  ch.on('broadcast', { event: 'rq' }, ({ payload }) => { if (L.mode === 'host' && !GS.running) { applyReq(payload.pid, payload.r); } });
  ch.on('broadcast', { event: 'start' }, ({ payload }) => { if (!isHost() && !GS.running && L.seenHost) { L.started = true; startGame(payload, 'client'); } });
  ch.on('broadcast', { event: 's' }, ({ payload }) => { if (GS.running && GS.mode === 'client') { GS.lastNet = performance.now(); applySnap(payload); } });
  ch.on('broadcast', { event: 'in' }, ({ payload }) => { if (GS.running && GS.mode === 'host' && GS.sim) GS.sim.input(payload.pid, payload.c); });
  ch.on('broadcast', { event: 'kick' }, ({ payload }) => { if (payload.pid === myPid && !isHost()) { leaveLobby(); menuErr = payload.reason || 'Removed from the lobby.'; renderMenu(); } });

}
function pushPresence() { if (L.ch) L.ch.track({ pid: myPid, name: myName, color: myColor, host: L.mode === 'host', joined: L.joined, v: BUILD, ln: L.mode === 'host' ? L.lobbyName : undefined, started: L.mode === 'host' ? L.started : undefined }); }
function lsChanged() { if (L.mode === 'host' && L.ch) { L.ch.send({ type: 'broadcast', event: 'ls', payload: LS }); advertise(); } renderLobby(); }
function req(r) { if (isHost()) applyReq(myPid, r); else if (L.ch) L.ch.send({ type: 'broadcast', event: 'rq', payload: { pid: myPid, r } }); }
function applyReq(pid, r) {
  const me = LS.pl[pid]; if (!me) return; const host = pid === myPid;
  if (r.a === 'seat') { const i = r.i | 0; if (i < 0 || i > 4 || LS.seats[i]) return; LS.seats = LS.seats.map(s => s === pid ? null : s); LS.seats[i] = pid; if (!host) me.ready = false; }
  else if (r.a === 'color') { if (!TD.COLORS.some(c => c.id === r.c) || usedColors(pid).has(r.c)) return; me.color = r.c; }
  else if (r.a === 'race') { if (!TD.RACES.some(x => x.id === r.race && x.on)) return; me.race = r.race; }
  else if (r.a === 'ready') me.ready = !!r.v;
  else if (host && r.a === 'map') { if (TD.MAPS.some(m => m.id === r.m && m.on)) LS.map = r.m; }
  else if (host && r.a === 'ai' && (r.i | 0) > 0) { const i = r.i | 0; if (i > 4) return; if (LS.seats[i] === 'ai') { LS.seats[i] = null; delete LS.aiCol[i]; } else if (!LS.seats[i]) { const used = usedColors(null); LS.seats[i] = 'ai'; LS.aiCol[i] = (TD.COLORS.find(c => c.id !== 'red' && !used.has(c.id)) || TD.COLORS[1]).id; } }
  else if (host && r.a === 'ai') { if (LS.seats[0] === 'ai') LS.seats[0] = null; else if (!LS.seats[0]) { LS.seats[0] = 'ai'; for (const p of Object.values(LS.pl)) if (p.color === 'red') p.color = (TD.COLORS.find(c => c.id !== 'red' && !Object.values(LS.pl).some(q => q.color === c.id)) || TD.COLORS[1]).id; } }
  else if (host && r.a === 'kick' && r.pid !== myPid) { if (L.ch) L.ch.send({ type: 'broadcast', event: 'kick', payload: { pid: r.pid, reason: 'The host removed you from the lobby.' } }); }

  lsChanged();
}
function leaveLobby(silent) {
  stopQuick(); unadvertise(); clearTimeout(L.joinTimer); clearTimeout(L.hostGone); L.hostGone = null;
  if (L.ch) { try { L.ch.untrack(); getSB().removeChannel(L.ch); } catch (e) { } }
  L.ch = null; L.code = null; L.seenHost = false; L.quick = false; L.mode = null;
  if (silent) return; homeScreen = 'home'; show('menu'); renderMenu();
}
// ---------- lobby screen ----------
function seatRow(i) {
  const s = LS.seats[i], p = s && s !== 'ai' ? LS.pl[s] : null, mine = s === myPid;
  if (s === 'ai' && i === 0) return `<div class="seat"><div class="sw" style="background:${colHex('red')}"></div><div class="grow"><b>AI Attacker</b><small class="muted">Human · Red</small></div>${isHost() && L.mode !== 'solo' ? '<button class="btn ghost sm" data-ai="0">Remove AI</button>' : '<span class="tag ok">Ready</span>'}</div>`;
  if (s === 'ai') { const c = LS.aiCol[i] || 'blue'; return `<div class="seat"><div class="sw" style="background:${colHex(c)}"></div><div class="grow"><b>${aiName(i)}</b><small class="muted">Human · ${(TD.COLORS.find(q => q.id === c) || {}).n || ''}</small></div>${isHost() ? `<button class="btn ghost sm" data-ai="${i}">Remove AI</button>` : '<span class="tag ok">Ready</span>'}</div>`; }
  if (!p) return `<div class="seat open" data-seat="${i}"><div class="sw" style="background:#0004"></div><div class="grow"><b>${i === 0 ? 'Open attacker seat' : 'Open defender seat'}</b><small>Tap to take this seat</small></div>${isHost() && (i > 0 || L.mode !== 'solo') ? `<button class="btn sm" data-ai="${i}">${i === 0 ? 'Add AI attacker' : 'Add AI'}</button>` : ''}</div>`;
  const ishost = L.mode === 'solo' ? true : (L.players.find(q => q.pid === s) || {}).host || (isHost() && s === myPid);
  return `<div class="seat ${mine ? 'mine' : ''}"><div class="sw" style="background:${colHex(p.color)}"></div><div class="grow"><b>${esc(p.name)}${mine ? ' (you)' : ''}${ishost ? ' 👑' : ''}</b><small class="muted">${(TD.RACES.find(r => r.id === p.race) || TD.RACES[0]).n} · ${(TD.COLORS.find(c => c.id === p.color) || {}).n || ''}</small></div><span class="tag ${p.ready || ishost ? 'ok' : ''}">${ishost ? 'Host' : p.ready ? 'Ready' : 'Not ready'}</span>${isHost() && L.mode === 'host' && s !== myPid ? `<button class="btn ghost sm" data-kick="${esc(s)}">✕</button>` : ''}</div>`;
}
function startable() {
  const atk = LS.seats[0], defs = LS.seats.slice(1).filter(Boolean);
  if (!atk) return 'Fill the attacker seat (a player, or Add AI attacker).';
  if (!defs.length) return 'At least one defender is needed.';
  const seated = new Set(LS.seats.filter(s => s && s !== 'ai'));
  if (L.mode === 'host' && L.players.some(p => p.v === BUILD && !seated.has(p.pid))) return 'Everyone in the lobby needs a seat.';
  const notReady = [...seated].filter(pid => pid !== myPid && !(LS.pl[pid] || {}).ready); if (notReady.length) return 'Waiting for everyone to ready up…';
  return '';
}
function renderLobby() {
  if ($('lobby').classList.contains('hidden')) return;
  const me = LS.pl[myPid]; if (!me) { $('seats').innerHTML = '<div class="spin"></div>'; return; }
  const nd = LS.seats.slice(1).filter(Boolean).length;
  $('lobbyEyebrow').textContent = (L.mode === 'solo' ? 'Practice · 1v' + Math.max(1, nd) : (LS.seats[0] === 'ai' ? 'vs AI attacker' : '1v' + Math.max(1, nd))) + ' · ' + mapName(LS.map);
  $('lobbyTitle').textContent = L.mode === 'solo' ? L.lobbyName : (L.lobbyName || (((L.players.find(p => p.host) || {}).name) || myName) + "'s Lobby");
  $('mapPick').innerHTML = TD.MAPS.map(m => `<button class="mapCard ${LS.map === m.id ? 'on' : ''}" data-map="${m.id}" ${m.on && isHost() ? '' : 'disabled'}><div class="mapThumb" style="background:${m.on ? 'linear-gradient(135deg,#4f7a3a,#2f5a2a 60%,#b38f5c 61%,#b38f5c 66%,#4f7a3a 67%)' : '#2a2620'}"></div><b>${m.n}</b><small>${m.on ? (isHost() ? m.d : 'Host picks the map') : 'Coming soon'}</small></button>`).join('');
  $('seats').innerHTML = `<div class="seatHead">Attacker</div>${seatRow(0)}<div class="seatHead">Defenders</div>${[1, 2, 3, 4].map(seatRow).join('')}`;
  $('racePick').innerHTML = TD.RACES.map(r => `<button class="race ${me.race === r.id ? 'on' : ''}" data-race="${r.id}" ${r.on ? '' : 'disabled'}>${r.n}<small>${r.on ? 'Available' : 'Coming soon'}</small></button>`).join('');
  const taken = usedColors(myPid);
  $('colorPick').innerHTML = TD.COLORS.map(c => `<button class="swatch ${me.color === c.id ? 'on' : ''}" data-col="${c.id}" title="${c.n}" style="background:${c.c}" ${taken.has(c.id) ? 'disabled' : ''}></button>`).join('');
  const why = startable(), btn = $('btnReady');
  if (isHost()) { btn.textContent = L.mode === 'solo' ? 'Start' : 'Start match'; btn.disabled = !!why; btn.onclick = hostStart; $('lobbyHint').textContent = why || (L.mode === 'solo' ? (LS.seats[0] === myPid ? 'You attack the AI defenders. Add AI to more seats for a bigger fight (each lane gets its own AI).' : 'You defend; the AI attacks. Add AI defenders as teammates, or tap a seat to switch lanes.') : 'Ready to start. Keep this page open: your device runs the match.'); }
  else { btn.disabled = false; btn.textContent = me.ready ? 'Unready' : 'Ready'; btn.onclick = () => req({ a: 'ready', v: !me.ready }); $('lobbyHint').textContent = 'Tap an open seat to switch seats. The host starts the match.'; }
  $('btnLeave').textContent = L.mode === 'solo' ? 'Back' : L.mode === 'host' ? 'Close lobby' : 'Leave';
  $('btnLeave').onclick = () => { if (L.mode === 'solo') { L.mode = null; show('menu'); renderMenu(); } else leaveLobby(); };
  const lob = $('lobby');
  lob.querySelectorAll('[data-seat]').forEach(b => b.onclick = e => { if (e.target.closest('[data-ai]')) return; req({ a: 'seat', i: +b.dataset.seat }); });
  lob.querySelectorAll('[data-ai]').forEach(b => b.onclick = e => { e.stopPropagation(); req({ a: 'ai', i: +b.dataset.ai || 0 }); });
  lob.querySelectorAll('[data-kick]').forEach(b => b.onclick = () => req({ a: 'kick', pid: b.dataset.kick }));
  lob.querySelectorAll('[data-map]').forEach(b => b.onclick = () => req({ a: 'map', m: b.dataset.map }));
  lob.querySelectorAll('[data-race]').forEach(b => b.onclick = () => req({ a: 'race', race: b.dataset.race }));
  lob.querySelectorAll('[data-col]').forEach(b => b.onclick = () => { if (!isHost()) { myColor = b.dataset.col; store.set('color', myColor); } req({ a: 'color', c: b.dataset.col }); });
}
function hostStart() {
  if (startable()) return; goFull();
  const players = [];
  const a = LS.seats[0]; players.push(a === 'ai' ? { pid: 'ai', name: 'AI Attacker', role: 'atk', color: 'red', race: 'human', bot: 1 } : { pid: a, name: LS.pl[a].name, role: 'atk', color: LS.pl[a].color, race: LS.pl[a].race });
  LS.seats.slice(1).forEach((s, j) => { const i = j + 1; if (s === 'ai') players.push({ pid: 'aid' + i, name: aiName(i), role: 'def', color: LS.aiCol[i] || 'blue', race: 'human', bot: 1 }); else if (s && LS.pl[s]) players.push({ pid: s, name: LS.pl[s].name, role: 'def', color: LS.pl[s].color, race: LS.pl[s].race }); });

  if (L.mode === 'host') { L.started = true; stopQuick(); unadvertise(); pushPresence(); L.ch.send({ type: 'broadcast', event: 'start', payload: cfg }); }
  startGame(cfg, L.mode);

// ============================ GAME ============================
const GS = { running: false, mode: null, sim: null, timer: null, lastNet: 0 };
let V = null; // what this screen shows, built from snapshots
const cv = $('view'), x = cv.getContext('2d'), X0 = x;
const DPR = Math.min(2, window.devicePixelRatio || 1);
