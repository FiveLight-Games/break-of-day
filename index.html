<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#120d08">
<title>Break of Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--stone:#1c1712;--stone2:#2a2219;--gold:#d9b25f;--gold2:#f0d68a;--ink:#efe6d2;--muted:#a59a83;--red:#e0483e;--blue:#4a9aff;--green:#5ad06a;--line:#5a4a30}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0907;color:var(--ink);font:14px/1.35 Inter,system-ui,sans-serif;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit}
.hidden{display:none!important}
h1,h2,h3{font-family:Cinzel,serif;margin:0 0 8px}
small{display:block;color:var(--muted);font-size:11px}
.muted{color:var(--muted)} .gold{color:var(--gold2)} .ok{color:var(--green)} .warnTxt{color:#ff9a5a}
.btn{background:linear-gradient(#5a4220,#3a2a14);border:1px solid var(--gold);border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer;box-shadow:inset 0 1px 0 #ffffff22,0 2px 6px #0008;color:var(--gold2)}
.btn:hover:not(:disabled){filter:brightness(1.2)} .btn:disabled{opacity:.4;cursor:default}
.btn.sm{padding:6px 10px;font-size:12px} .btn.wide{width:100%;margin:4px 0} .btn.ghost{background:transparent} .btn.danger{border-color:var(--red);color:#ffb0a0}
.panel{background:linear-gradient(var(--stone2),var(--stone));border:1px solid var(--line);border-radius:12px;box-shadow:0 0 0 1px #000,inset 0 0 0 1px #ffffff0d,0 10px 30px #000a}
input{background:#0e0b08;border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:10px 12px;font:inherit;width:100%;user-select:text;-webkit-user-select:text}
.screen{position:fixed;inset:0;overflow:auto}
/* menu */
#menu{background:radial-gradient(ellipse at 50% 120%,#c0602a 0%,#4a1e14 30%,#120c10 65%,#07060a 100%);display:flex;align-items:center;justify-content:center;padding:20px}
.menuBox{width:min(440px,100%);padding:22px}
.logo{text-align:center;margin-bottom:14px}
.logo h1{font-size:40px;font-weight:800;letter-spacing:2px;background:linear-gradient(#fff3c0,#e0a040 60%,#a0501a);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 30px #ff8a2a44;margin:0}
.logo .sunrise{height:6px;margin:6px auto 0;width:70%;background:radial-gradient(ellipse at 50% 100%,#ffd070,#ff7a2a00 70%)}
.field{margin:10px 0}.field label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.rooms{margin-top:12px;max-height:180px;overflow:auto}
.room{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin:4px 0;background:#0006}
.room span:last-child{display:flex;gap:8px;align-items:center}
#ver{text-align:center;margin-top:12px;font-size:11px;color:var(--muted)}
/* lobby */
#lobby{background:radial-gradient(ellipse at 50% 0,#2a1c12,#0b0907 70%);padding:16px;display:flex;justify-content:center}
.lobbyWrap{display:grid;grid-template-columns:minmax(260px,340px) minmax(280px,460px);gap:14px;max-width:820px;width:100%;align-self:flex-start}
@media(max-width:700px){.lobbyWrap{grid-template-columns:1fr}}
.lobbyWrap .panel{padding:16px}
.code{font-family:Cinzel,serif;font-size:26px;color:var(--gold2);letter-spacing:4px}
.pRow{display:flex;align-items:center;gap:10px;padding:8px;border-bottom:1px solid #ffffff10}.pRow span:nth-child(2){flex:1}
.hPort{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 20px Cinzel,serif;color:#1a1208;border:2px solid var(--gold);box-shadow:inset 0 -6px 10px #0005;flex:none}
.hPort.sm{width:34px;height:34px;font-size:15px}.hPort.xs{width:26px;height:26px;font-size:12px;border-width:1px}
#heroPick{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:10px 0}
.heroCard{display:flex;gap:8px;align-items:center;text-align:left;padding:8px;border-radius:10px;border:1px solid var(--line);background:#0005;cursor:pointer}
.heroCard.sel{border-color:var(--hc);box-shadow:0 0 0 1px var(--hc),0 0 18px -4px var(--hc);background:#ffffff0a}
.statGrid{display:grid;grid-template-columns:1fr auto;gap:2px 12px;margin:8px 0;font-size:13px}.statGrid span{color:var(--muted)}
.abInfo{margin:8px 0;padding:8px;border-left:2px solid var(--gold);background:#0004;border-radius:0 6px 6px 0}.abInfo p{margin:4px 0 0;font-size:12px;color:#d8ccb0}
#heroInfo h3 small{display:inline;margin-left:6px}
/* game */
#game{position:fixed;inset:0;overflow:hidden}
#view,#overlay{position:absolute;inset:0}#overlay{pointer-events:none}
.hud{position:absolute;pointer-events:none}.hud *{pointer-events:auto}
#topbar{top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center}
#clock{padding:6px 14px;text-align:center;font:700 14px Cinzel,serif;border-radius:10px;min-width:150px}
#clock small{font-family:Inter;font-weight:600}
#clock.night{border-color:#6a7acc;box-shadow:0 0 18px -4px #6a7aff}
.sunI{color:#ffcf4a}.moon{color:#b8c8ff}
#gold{padding:8px 12px;border-radius:10px;font-weight:800;color:var(--gold2)}
#me{top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));display:flex;gap:8px;padding:8px;border-radius:12px;width:240px}
#portrait{position:relative;cursor:pointer}
#lvl{position:absolute;bottom:-4px;right:-4px;background:#1a1208;border:1px solid var(--gold);border-radius:10px;font:800 11px Inter;padding:1px 5px;color:var(--gold2)}
.bars{flex:1;display:flex;flex-direction:column;gap:3px}
.barO{position:relative;height:14px;background:#0009;border-radius:4px;overflow:hidden;border:1px solid #000}
.barO .fill{height:100%;transition:width .15s}.barO span{position:absolute;inset:0;font:700 10px/14px Inter;text-align:center;text-shadow:0 1px 2px #000}
#hpFill{background:linear-gradient(#5ae06a,#2a9a3a)} .res-Mana{background:linear-gradient(#5a9aff,#2a5ad0)}.res-Rage{background:linear-gradient(#ff5a4a,#a02a1a)}.res-Energy{background:linear-gradient(#ffe25a,#c0a01a)}.res-Resolve{background:linear-gradient(#ffb04a,#b0681a)}
#xpO{height:4px}#xpFill{background:#c8a0ff}
#buffs{display:flex;flex-wrap:wrap;gap:3px}.buff{font-size:9px;padding:1px 5px;border-radius:6px;background:#ffffff14;color:var(--gold2)}.buff.ward{color:#9fd0ff}
#allies{top:calc(max(8px,env(safe-area-inset-top)) + 88px);left:max(8px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:4px}
.ally{display:flex;gap:6px;align-items:center;background:#000a;padding:4px 8px 4px 4px;border-radius:20px;border:1px solid var(--line);min-width:140px}
.aInfo{flex:1;font-size:11px}.aInfo b{color:var(--gold2)}.mini-bar{height:4px;background:#300;border-radius:2px;overflow:hidden}.mini-bar div{height:100%;background:var(--green)}.dead{color:#ff8a7a}
#topRight{top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:46vw}
.ibtn{min-width:46px;height:46px;border-radius:10px;padding:0 8px;background:linear-gradient(var(--stone2),var(--stone));border:1px solid var(--line);font-size:18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;color:var(--gold2)}
.ibtn small{font-size:9px;margin-top:2px}
.ibtn.glow{border-color:var(--gold2);box-shadow:0 0 14px -2px var(--gold);animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 22px 0 var(--gold)}}
#feed{top:calc(max(8px,env(safe-area-inset-top)) + 58px);left:50%;transform:translateX(-50%);width:min(560px,60vw);display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:none}
.msg{font-size:12px;font-weight:600;padding:3px 10px;border-radius:6px;background:#000b;text-align:center;transition:opacity .8s;pointer-events:none}
.msg.fade{opacity:0}.c-gold{color:var(--gold2)}.c-r{color:#ff8a7a}.c-p{color:#b8c0ff}.c-w{color:#eee}
.c-r3{color:#3a8dff}.c-r4{color:#b05bff}.c-r5{color:#ffc62a;text-shadow:0 0 8px #ffc62a88}.c-r6{color:#ff3434;text-shadow:0 0 10px #ff343488;font-weight:800}
#nightWarn{top:calc(max(8px,env(safe-area-inset-top)) + 56px);left:50%;transform:translateX(-50%) translateY(-6px);font:800 11px Inter;color:#ff6a6a;letter-spacing:1px;text-shadow:0 0 8px #f00;pointer-events:none}
#minimap{position:absolute;left:max(8px,env(safe-area-inset-left));bottom:max(8px,env(safe-area-inset-bottom));width:150px;height:170px;border:2px solid var(--gold);border-radius:8px;box-shadow:0 4px 16px #000c;pointer-events:auto;touch-action:none}
#invWrap{left:calc(max(8px,env(safe-area-inset-left)) + 162px);bottom:max(8px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}
#inv{display:grid;grid-template-columns:repeat(3,38px);gap:4px;cursor:pointer}
.slot{width:38px;height:38px;border:1px solid #4a3e2a;border-radius:6px;background:#0009;font:800 10px Inter;display:flex;align-items:center;justify-content:center;color:#ccc}
.row2{display:flex;gap:4px}.row2 .ibtn{min-width:38px;height:38px;font-size:15px}
#abilities{right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,auto);gap:8px;align-items:end}
.abw{position:relative;display:flex;flex-direction:column;align-items:center}
.ab{position:relative;width:64px;height:64px;border-radius:50%;border:2px solid var(--gold);background:radial-gradient(circle at 40% 35%,#5a4628,#1a1208);cursor:pointer;overflow:hidden;padding:0;touch-action:none}
.abw:last-child .ab{width:72px;height:72px;border-color:#ff9a4a}
.ab .abKey{position:absolute;top:4px;left:0;right:0;font:800 16px Cinzel,serif;color:var(--gold2)}
.ab .abName{position:absolute;bottom:14px;left:2px;right:2px;font:700 8.5px Inter;line-height:1;color:#e8dcc0}
.ab .pips{position:absolute;bottom:5px;left:0;right:0;display:flex;justify-content:center;gap:2px}.pips i{width:5px;height:5px;border-radius:50%;background:#0008;border:1px solid #a08a5a}.pips i.on{background:var(--gold2)}
.ab .cdOv{position:absolute;inset:0;border-radius:50%}
.ab .cdTxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:800 22px Inter;text-shadow:0 0 4px #000}
.ab.locked{filter:grayscale(1) brightness(.5)}.ab.nores{box-shadow:inset 0 0 0 3px #3a5aff99}
.ab.aiming{box-shadow:0 0 0 3px #ffd36b,0 0 20px #ffb02a}
.lvlup{position:absolute;top:-26px;width:26px;height:26px;border-radius:50%;background:radial-gradient(#ffe27a,#c08a1a);border:1px solid #fff4c0;color:#3a2000;font:900 17px/24px Inter;text-align:center;cursor:pointer;animation:pulse 1s infinite;padding:0}
#attrBtn{position:absolute;right:0;top:-34px;font-size:11px}
#sideBtns{right:max(10px,env(safe-area-inset-right));bottom:calc(max(10px,env(safe-area-inset-bottom)) + 108px);display:flex;gap:6px}
#potCount{position:absolute;top:2px;right:4px;font:800 10px Inter}
#btnPot{position:relative}
#abTip{right:max(10px,env(safe-area-inset-right));bottom:calc(max(10px,env(safe-area-inset-bottom)) + 160px);width:280px;padding:10px;font-size:12px}#abTip p{margin:4px 0}
#aimHint{bottom:calc(max(10px,env(safe-area-inset-bottom)) + 96px);left:50%;transform:translateX(-50%);background:#000c;padding:6px 12px;border-radius:8px;font-size:12px;color:#ffd36b;pointer-events:none}
#channel{bottom:30%;left:50%;transform:translateX(-50%);width:220px;text-align:center;font:700 12px Inter;pointer-events:none}
#channel .barO{height:10px}#channelFill{background:linear-gradient(90deg,#6ab0ff,#c0e0ff);height:100%}
#deathOv{inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(transparent 30%,#300a 100%);pointer-events:none!important;filter:none}
#deathOv *{pointer-events:none}#deathTxt{font:800 24px Cinzel,serif;color:#ffb0a0;text-shadow:0 2px 8px #000}
#rotateHint{position:absolute;bottom:50%;left:50%;transform:translateX(-50%);background:#000c;border:1px solid var(--gold);padding:8px 14px;border-radius:10px;font-size:12px;pointer-events:none;opacity:.9}
#netOv{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;background:#0008}
#btnRejoin{border-color:#7ad0ff;color:#bfe8ff}
#toasts{position:fixed;top:30%;left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:4px;align-items:center;pointer-events:none}
.toast{background:#000d;border:1px solid var(--line);padding:6px 12px;border-radius:8px;font-size:13px;animation:fadeT 2.6s forwards}.toast.warn{color:#ffb07a}.toast.info{color:#9fd0ff}
@keyframes fadeT{0%{opacity:0;transform:translateY(6px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
/* modal */
#modalBg{position:fixed;inset:0;background:#000a;z-index:40;display:flex;align-items:center;justify-content:center;padding:12px}
#modal{position:relative;width:min(560px,100%);max-height:88vh;overflow:auto;padding:16px}
#modal .x{position:absolute;top:8px;right:8px;background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted)}
.status{font-size:12px;margin-bottom:8px;color:#d8ccb0}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}.tab{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:#0006;cursor:pointer;font-size:12px;font-weight:700}.tab.on{border-color:var(--gold);color:var(--gold2);background:#ffffff10}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border:1px solid #ffffff14;border-radius:8px;background:#0005}
.item.r5{border-color:#ffc62a66;background:linear-gradient(90deg,#ffc62a14,#0005)}.item.r6{border-color:#ff343488;background:linear-gradient(90deg,#ff343420,#0005)}.item.picked{outline:2px solid var(--gold2)}
.lore{font-style:italic;color:#c8b88a}
.laneHdr{margin-top:8px;font:800 14px Cinzel,serif;color:var(--gold2)}
.town{padding:8px 10px;border:1px solid #ffffff14;border-radius:8px;background:#0005}.town.held{border-color:#4a9aff66}
.tTop,.tMid,.tBot{display:flex;justify-content:space-between;align-items:center;gap:8px}.tMid{font-size:12px;color:#d8ccb0;margin:3px 0}
.pip{display:inline-block;width:10px;height:10px;border-radius:2px;border:1px solid var(--gold);margin-left:3px;transform:rotate(45deg)}.pip.on{background:var(--gold2);box-shadow:0 0 6px var(--gold)}
.tierBtns{display:flex;gap:6px}.railLine{font-size:11px;margin:4px 0;color:#7a6e58}.station.built{color:#d8ccb0}.station.built.ok{color:var(--gold2)}.rideRow{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.tierBtns .btn{min-width:40px;font-size:16px}
/* stats */
.tblWrap{overflow:auto;max-height:60vh;border:1px solid var(--line);border-radius:8px}
table.stats{border-collapse:collapse;width:100%;font-size:12px}
.stats th,.stats td{padding:5px 8px;border-bottom:1px solid #ffffff10;text-align:right;white-space:nowrap}
.stats th{position:sticky;top:0;background:var(--stone2);font-family:Cinzel,serif}.stats th small{font-family:Inter}
.stats td:first-child{text-align:left;color:#d8ccb0;position:sticky;left:0;background:#1c1712}
.stats td.best{color:var(--gold2);font-weight:800}
/* end */
#end{background:radial-gradient(ellipse at 50% 0,#3a2410,#0b0907 70%);display:flex;justify-content:center;padding:20px}
.endBox{width:min(820px,100%);padding:20px;align-self:flex-start;text-align:center}
#endTitle{font:800 54px Cinzel,serif;margin:0}#endTitle.win{color:#ffd36b;text-shadow:0 0 30px #ffb02a}#endTitle.lose{color:#ff6a5a;text-shadow:0 0 30px #a01a1a}
#endStats{margin:16px 0;text-align:left}
@media(max-height:500px){.ab{width:54px;height:54px}.abw:last-child .ab{width:60px;height:60px}#minimap{width:120px;height:136px}#invWrap{left:calc(max(8px,env(safe-area-inset-left)) + 132px)}#me{width:210px}#allies{top:76px}#sideBtns{bottom:calc(max(10px,env(safe-area-inset-bottom)) + 90px)}}
</style>
</head>
<body>
<div id="menu" class="screen">
  <div class="menuBox panel">
    <div class="logo"><h1>Break of Day</h1><div class="sunrise"></div><small>Hold the towns. Survive the night. Shatter the Core.</small></div>
    <div class="field"><label>Your name</label><input id="nameIn" maxlength="16"></div>
    <button class="btn wide hidden" id="btnRejoin">↻ Rejoin Match</button>
    <button class="btn wide" id="btnSolo">⚔ Play Solo</button>
    <button class="btn wide" id="btnCreate">👑 Create Co-op Room</button>
    <div class="row field"><input id="codeIn" placeholder="ROOM CODE" maxlength="6" style="text-transform:uppercase"><button class="btn" id="btnJoin" style="flex:0 0 auto">Join</button></div>
    <div class="field"><label>Open rooms</label><div id="roomList" class="rooms"><div class="muted">Connecting…</div></div></div>
    <div id="ver"></div>
  </div>
</div>
<div id="lobby" class="screen hidden">
  <div class="lobbyWrap">
    <div class="panel">
      <h2 id="lobbyTitle">War Party</h2>
      <div class="muted">Room code</div><div class="code" id="lobbyCode"></div>
      <div id="playerList" style="margin:10px 0"></div>
      <button class="btn wide" id="btnReady">Ready</button>
      <div class="muted" id="lobbyHint" style="margin:6px 0"></div>
      <button class="btn wide ghost" id="btnLeave">Leave</button>
    </div>
    <div class="panel">
      <h2>Choose Your Hero</h2>
      <div id="heroPick"></div>
      <div id="heroInfo"></div>
    </div>
  </div>
</div>
<div id="game" class="hidden">
  <div id="view"></div>
  <canvas id="overlay"></canvas>
  <div id="topbar" class="hud"><div id="clock" class="panel"></div><div id="gold" class="panel"></div></div>
  <div id="nightWarn" class="hud hidden">☾ NIGHT FURY — ENEMIES IN THIS LANE ARE EMPOWERED</div>
  <div id="feed" class="hud"></div>
  <div id="me" class="hud panel">
    <div id="btnHero"><div id="portrait" class="hPort"></div><span id="lvl"></span></div>
    <div class="bars">
      <div class="barO"><div class="fill" id="hpFill"></div><span id="hpTxt"></span></div>
      <div class="barO"><div class="fill" id="resFill"></div><span id="resTxt"></span></div>
      <div class="barO" id="xpO"><div class="fill" id="xpFill"></div></div>
      <div id="buffs"></div>
    </div>
  </div>
  <div id="allies" class="hud"></div>
  <div id="topRight" class="hud">
    <button class="ibtn" id="btnShop">🛒<small>Shop</small></button>
    <button class="ibtn" id="btnTowns">⚑<small>Council</small></button>
    <button class="ibtn" id="btnStats">📜<small>Stats</small></button>
    <button class="ibtn" id="btnMenu">☰<small>Menu</small></button>
  </div>
  <canvas id="minimap" width="150" height="170"></canvas>
  <div id="invWrap" class="hud">
    <div class="row2"><button class="ibtn" id="btnCenter" title="Recenter (Space)">◎</button><button class="ibtn" id="btnStop" title="Stop (S)">✋</button></div>
    <div id="inv"></div>
  </div>
  <div id="sideBtns" class="hud">
    <button class="ibtn" id="btnPot">🧪<span id="potCount">2</span></button>
    <button class="ibtn" id="btnRecall">⌂<small>Recall</small></button>
  </div>
  <div id="abilities" class="hud">
    <button class="btn sm hidden" id="attrBtn">+ Stats</button>
    <div class="abw"><button class="lvlup hidden">+</button><button class="ab"><span class="abKey"></span><span class="abName"></span><span class="pips"></span><span class="cdOv"></span><span class="cdTxt"></span></button></div>
    <div class="abw"><button class="lvlup hidden">+</button><button class="ab"><span class="abKey"></span><span class="abName"></span><span class="pips"></span><span class="cdOv"></span><span class="cdTxt"></span></button></div>
    <div class="abw"><button class="lvlup hidden">+</button><button class="ab"><span class="abKey"></span><span class="abName"></span><span class="pips"></span><span class="cdOv"></span><span class="cdTxt"></span></button></div>
    <div class="abw"><button class="lvlup hidden">+</button><button class="ab"><span class="abKey"></span><span class="abName"></span><span class="pips"></span><span class="cdOv"></span><span class="cdTxt"></span></button></div>
  </div>
  <div id="abTip" class="hud panel hidden"></div>

    c.fillStyle = e[2] === 0 ? '#6ad07a' : e[2] === 1 ? (v === 'stalker' ? '#ff2a8a' : '#ff5a5a') : '#c8a050'; c.fillRect(x - 1, z - 1, 2, 2);
  }
  // fog of war
  if (s.vs) { const fc = G.fogC || (G.fogC = Object.assign(document.createElement('canvas'), { width: 150, height: 170 })), f = fc.getContext('2d');
    f.globalCompositeOperation = 'source-over'; f.clearRect(0, 0, 150, 170); f.fillStyle = 'rgba(0,0,0,0.55)'; f.fillRect(0, 0, 150, 170); f.globalCompositeOperation = 'destination-out';
    for (const v of s.vs) { f.beginPath(); f.arc(mx(v[0]), mz(v[1]), v[2] / DW.MAP.W * 75, 0, 7); f.fill(); } c.drawImage(fc, 0, 0); }
  for (const h of s.h) { if (h.dead) continue; c.fillStyle = DW.HEROES[h.hid].col; c.beginPath(); c.arc(mx(h.x), mz(h.z), h.pid === myPid ? 4.5 : 3.5, 0, 7); c.fill(); c.strokeStyle = h.pid === myPid ? '#fff' : '#000'; c.lineWidth = 1.5; c.stroke(); }
  // camera rect
  const vw = G.zoom * 0.9, vh = G.zoom * 0.7; c.strokeStyle = '#fff8'; c.lineWidth = 1; c.strokeRect(mx(G.camX - vw), mz(G.camZ - vh - 4), mx(vw) - mx(0) + mx(vw) - mx(0), (mz(vh) - mz(0)) * 2);
}
let hudT = 0;
function updateHUD(now) {
  if (now - hudT < 100) return; hudT = now;
  const s = G.cur, me = G.me; if (!me) return; const H = DW.HEROES[me.hid];
  const pt = s.t % DW.CYC, night = s.ph === 'night';
  $('clock').innerHTML = `<span class="${night ? 'moon' : 'sunI'}">${night ? '☾' : '☀'}</span> ${fmtT(s.t)} · Day ${s.cy}<small>${night ? 'Dawn in ' + fmtT(DW.CYC - pt) : 'Night in ' + fmtT(DW.DAY - pt)}${s.ec ? ' · ECLIPSE' : ''}</small>`;
  $('clock').classList.toggle('night', night);
  $('gold').textContent = '◉ ' + me.g;
  $('portrait').style.background = H.col; $('portrait').textContent = H.name[0]; $('lvl').textContent = me.lvl;
  $('hpFill').style.width = (me.hp / me.mhp * 100) + '%'; $('hpTxt').textContent = me.hp + ' / ' + me.mhp;
  $('resFill').style.width = (me.res / Math.max(1, me.mres) * 100) + '%'; $('resTxt').textContent = me.res + ' / ' + me.mres + ' ' + H.res.type; $('resFill').className = 'fill res-' + H.res.type;
  $('xpFill').style.width = (me.lvl >= 20 ? 100 : me.xp / me.xn * 100) + '%';
  // abilities
  document.querySelectorAll('.ab').forEach((b, i) => {
    const ab = H.ab[i], r = me.rk[i], cd = me.cd[i];
    b.querySelector('.abName').textContent = ab.n; b.querySelector('.abKey').textContent = 'QWER'[i];
    const maxCd = Array.isArray(ab.cd) ? ab.cd[Math.max(0, r - 1)] : ab.cd;
    b.querySelector('.cdOv').style.background = cd > 0 ? `conic-gradient(rgba(0,0,0,.72) ${cd / maxCd * 360}deg, transparent 0)` : 'none';
    b.querySelector('.cdTxt').textContent = cd > 0 ? Math.ceil(cd) : '';
    const cost = r ? (Array.isArray(ab.cost) ? ab.cost[r - 1] : ab.cost) : 0;
    b.classList.toggle('locked', !r); b.classList.toggle('nores', r > 0 && me.res < cost);
    b.querySelector('.pips').innerHTML = Array.from({ length: ab.ult ? 3 : 5 }, (_, j) => `<i class="${j < r ? 'on' : ''}"></i>`).join('');
    const canLv = me.pts > 0 && (i === 3 ? ([6, 11, 16][r] !== undefined && me.lvl >= [6, 11, 16][r]) : (r < 5 && r < Math.ceil(me.lvl / 2)));
    document.querySelectorAll('.lvlup')[i].classList.toggle('hidden', !canLv);
  });
  const anyLv = [0, 1, 2, 3].some(i => !document.querySelectorAll('.lvlup')[i].classList.contains('hidden'));
  $('attrBtn').classList.toggle('hidden', !(me.pts > 0 && !anyLv));
  $('potCount').textContent = me.pots;
  $('btnRecall').innerHTML = night ? '⛩<small>Waygate</small>' : '⌂<small>Recall</small>';
  $('btnShop').classList.toggle('glow', me.shop.any || (me.x - DW.MAP.forge.x) ** 2 + (me.z - DW.MAP.forge.z) ** 2 < 49);
  const atBase = (me.x - DW.MAP.fountain.x) ** 2 + (me.z - DW.MAP.fountain.z) ** 2 < 18 * 18;
  $('btnTowns').classList.toggle('glow', atBase);
  if (atBase && !me.dead && !G.townPromptDone && s.towns.some(t => t.team === 0) && $('modalBg').classList.contains('hidden')) { G.townPromptDone = true; toast('At base — tap Towns (G) to review the town budget', 'info'); }
  if (!atBase) G.townPromptDone = false;
  // recall bar
  if (me.rc) { $('channel').classList.remove('hidden'); $('channelFill').style.width = (100 - me.rc[1] / me.rc[2] * 100) + '%'; $('channelTxt').textContent = me.rc[0] === 'base' ? 'Recalling…' : 'Waygate…'; } else $('channel').classList.add('hidden');
  // rails & raids
  // death
  $('deathOv').classList.toggle('hidden', !me.dead); if (me.dead) $('deathTxt').textContent = 'Respawning in ' + me.rt + 's';
  // night warning
  const inLaneMe = DW.laneDist(me.x, me.z) < 13 && me.z > -98 && me.z < 98;
  $('nightWarn').classList.toggle('hidden', !(night || s.ec) || !inLaneMe || me.dead || me.tw);
  // allies
  $('allies').innerHTML = s.h.filter(h => h.pid !== myPid).map(h => `<div class="ally"><div class="hPort xs" style="background:${DW.HEROES[h.hid].col}">${DW.HEROES[h.hid].name[0]}</div><div class="aInfo"><span>${esc(h.n)} <b>${h.lvl}</b></span><div class="mini-bar"><div style="width:${h.dead ? 0 : h.hp / h.mhp * 100}%"></div></div>${h.dead ? `<small class="dead">☠ ${h.rt}s</small>` : ''}</div></div>`).join('');
  // inventory
  $('inv').innerHTML = me.it.map((it, i) => `<div class="slot" style="${it ? 'border-color:' + itemCol(it) + ';color:' + itemCol(it) : ''}" title="${it ? esc(it.n + ' — ' + statLine(it.s)) : ''}">${it ? esc(it.n.split(' ').map(w => w[0]).join('').slice(0, 3)) : ''}</div>`).join('');
  $('inv').onclick = () => { G.shopTab = 'inv'; renderShop(); };
  // buffs
  $('buffs').innerHTML = me.bf.map(b => `<span class="buff">${b[0]} ${b[1]}</span>`).join('') + (me.tw ? '<span class="buff ward">Town Ward</span>' : '');
  if (modalRefresh && now - (G.modalRefT || 0) > 1000) { G.modalRefT = now; modalRefresh(); }
}

// ============================ BOOT ============================
window.addEventListener('load', () => { initMenu(); show('menu'); $('netLeave').onclick = () => { quitGame(); }; });
window.addEventListener('online', () => { if (G.running && G.mode === 'client') { G.reconnectT = 0; G.lastNet = 0; } });
window.BOD = { G, L, send };
})();
</script>
